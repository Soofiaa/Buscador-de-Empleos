  select.estado:hover { border-color:var(--accion-texto); }

<body>
<div class="aviso-previa" role="note">Vista previa estática · datos inventados · nada se guarda ni se envía a ningún servidor</div>
<div class="app">
  <aside class="lateral">
    <div class="marca">
      <h1>Búsqueda de empleo</h1>
      <select class="selector-tema" id="tema" aria-label="Tema visual">
        <option value="auto">Automático (según el sistema)</option>
        <optgroup label="Rosado"><option value="girly-claro">Rosado claro</option><option value="girly-oscuro">Rosado oscuro</option></optgroup>
        <optgroup label="Azul"><option value="hombre-claro">Azul claro</option><option value="hombre-oscuro">Azul oscuro</option></optgroup>
        <optgroup label="Neutro"><option value="neutro-claro">Neutro claro</option><option value="neutro-oscuro">Neutro oscuro</option></optgroup>
      </select>
    </div>
    <div class="sub" id="ultima"></div>
    <button class="boton ancho" id="buscar" type="button">Buscar empleos</button>
    <p class="nota">Una búsqueda completa toma unos 5 minutos. (En esta vista previa solo se simula el avance.)</p>
    <div class="progreso" id="progreso" role="status" aria-live="polite"></div>
    <div class="barra" id="barra" role="progressbar" aria-label="Avance de la búsqueda" aria-valuemin="0" hidden><div class="barra-relleno" id="barra-relleno"></div></div>
    <nav class="historial" id="historial" aria-label="Historial de búsquedas"></nav>
  </aside>
  <main class="principal">
    <header class="encabezado">
      <h2 class="titulo-sel" id="titulo-sel">Todas las ofertas</h2>
      <div class="sub" id="sub-sel"></div>
      <div class="fuentes-sel" id="fuentes-sel" hidden></div>
      <details class="panel" id="panel-corrida" hidden><summary>Resultado de la última búsqueda por fuente</summary><div id="corrida"></div></details>
    </header>
    <nav class="pestanas" id="pestanas" role="tablist" aria-label="Categorías de ofertas"></nav>
    <div class="filtros" id="filtros"></div>
    <div id="lista"></div>
  </main>
</div>
<div class="toast-container" id="toast" aria-live="polite"></div>

<script>
"use strict";
// ---------- funciones puras (iguales a las de informe.py, más las nuevas de esta propuesta)
const CERRADOS = new Set(["postulada", "entrevista", "descartada"]);
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
const dosDig = n => String(n).padStart(2, "0");
const diaISO = f => f.getFullYear() + "-" + dosDig(f.getMonth() + 1) + "-" + dosDig(f.getDate());
const horaDe = t => (t || "").slice(11, 16);
function fechaLarga(dia) { const [a, m, d] = dia.split("-").map(Number); return mayus(DIAS[new Date(a, m - 1, d).getDay()]) + " " + d + " de " + MESES[m - 1]; }
function etiquetaDia(dia, hoy) {
  if (dia === hoy) return "Hoy";

  partes.push(selector("fuente", "Fuente", unicos("fuente"), null, nombreFuente));
  if (S.pestana === "ofertas") {
    const g = h("select", { "aria-label": "Agrupar", onchange: e => { S.agrupar = e.target.value; pintarLista(); } },
      h("option", { value: "prioridad" }, "Agrupar: prioridad"), h("option", { value: "fuente" }, "Agrupar: fuente"));
    g.value = S.agrupar; partes.push(g);
  }
  const vista = v => h("button", { type: "button", class: "btn-vista", "aria-pressed": String(S.densidad === v),
    onclick: () => { S.densidad = v; try { localStorage.setItem("densidad", v); } catch (e) {} pintarLista(); pintarFiltros(); } }, v === "tarjetas" ? "Tarjetas" : "Compacta");
  partes.push(h("div", { class: "selector-vista", role: "group", "aria-label": "Densidad de la lista" }, vista("tarjetas"), vista("compacta")));
  const vacios = FILTROS_VACIOS();
  if (Object.keys(vacios).some(k => S.f[k] !== vacios[k]))
    partes.push(h("button", { type: "button", class: "btn-limpiar-filtros", onclick: () => { S.f = FILTROS_VACIOS(); pintarLista(); pintarFiltros(); } }, "Limpiar filtros"));
  $("filtros").replaceChildren(...partes);
}

// ---------- tarjetas
function selectorEstado(o) {
  const s = h("select", { class: "estado", "aria-label": "Estado de seguimiento de " + (o.titulo || "la oferta"), onchange: e => cambiarEstado(o, e.target.value) },
    ESTADOS.map(v => h("option", { value: v }, ETIQUETA_ESTADO[v])));
  s.value = o.estado; return s;
}
const inicial = o => ((o.empresa || "?").trim().charAt(0) || "?").toUpperCase();
const clasePrio = o => o.prioridad ? " prio-" + o.prioridad.toLowerCase() : "";
function tarjeta(o, completa) {
  const url = urlSegura(o.url);
  const meta = [o.empresa, o.ubicacion, completa ? o.modalidad : null, o.publicada ? "publicada " + fechaCL(o.publicada) : "sin fecha", nombreFuente(o.fuente)].filter(Boolean);
  const chips = [];
  if (completa) {
    if (o.estado === "nueva") chips.push(h("span", { class: "chip nueva" }, "nueva"));
    if (o.prioridad) chips.push(h("span", { class: "chip " + o.prioridad }, o.prioridad));
    for (const v of [o.tipo, o.contrato, o.experiencia && o.experiencia !== "No indicada" ? o.experiencia : ""]) if (v) chips.push(h("span", { class: "chip" + (/plazo/i.test(v) ? " aviso" : "") }, v));
    if (sueldoConocido(o.sueldo)) chips.push(h("span", { class: "chip sueldo" }, o.sueldo));
    const cd = (o.estado === "postulada" || o.estado === "entrevista") ? chipDias(diasDesde(o.fecha_postulacion, hoy())) : null;
    if (cd) chips.push(h("span", { class: "chip " + cd.clase }, cd.texto));
    for (const s of extraerSkills(o)) chips.push(h("span", { class: "skill" }, s));
  }
  return h("article", { class: "tarjeta" + clasePrio(o) + (CERRADOS.has(o.estado) ? " cerrada" : "") },
    h("div", { class: "tarjeta-header" },
      h("div", { class: "avatar-empresa", "aria-hidden": "true" }, inicial(o)),
      h("div", { class: "tarjeta-titulos" },
        h("div", { class: "fila-titulo" },
          h("a", { class: "titulo", href: url, target: "_blank", rel: "noopener noreferrer" }, o.titulo || "(sin título)"),
          h("a", { class: "btn-enlace-externo", href: url, target: "_blank", rel: "noopener noreferrer", "aria-label": "Abrir el aviso en " + nombreFuente(o.fuente) }, "↗"),
          selectorEstado(o)),
        h("div", { class: "meta-limpia" }, meta.flatMap((m, i) => i ? [h("span", { class: "meta-sep", "aria-hidden": "true" }, "·"), h("span", {}, m)] : [h("span", {}, m)])))),
    chips.length ? h("div", { class: "chips" }, chips) : null,
    completa && o.motivo ? h("div", { class: "motivo" }, o.motivo) : null,
    completa && o.notas ? h("div", { class: "notas" }, "Notas: " + o.notas) : null,
    !completa && o.razon ? h("div", { class: "razon" }, "Motivo: " + o.razon) : null);
}
function filaCompacta(o) {
  const url = urlSegura(o.url);
  return h("div", { class: "fila-compacta" + clasePrio(o) },
    h("div", { class: "avatar-empresa", "aria-hidden": "true" }, inicial(o)),
    h("div", { class: "cargo-box" }, h("a", { class: "cargo-titulo", href: url, target: "_blank", rel: "noopener noreferrer" }, o.titulo || "(sin título)"),
      h("span", { class: "cargo-empresa" }, [o.empresa, o.ubicacion].filter(Boolean).join(" · "))),
    sueldoConocido(o.sueldo) ? h("span", { class: "chip sueldo ocultar-movil" }, o.sueldo) : h("span", { class: "sub ocultar-movil" }, "—"),
    o.prioridad ? h("span", { class: "chip " + o.prioridad + " ocultar-movil" }, o.prioridad) : h("span", { class: "ocultar-movil" }),
    h("span", { class: "sub ocultar-movil" }, o.modalidad || "—"),
    selectorEstado(o),
    h("a", { class: "btn-enlace-externo", href: url, target: "_blank", rel: "noopener noreferrer", "aria-label": "Abrir el aviso" }, "↗"));
}
function pintarLista() {
  const cont = $("lista"), filas = listaDe(S.datos, S.pestana, S.sel).filter(pasa);
  if (!filas.length) { cont.replaceChildren(h("div", { class: "vacio" }, S.pestana === "ofertas" ? "No hay ofertas con estos filtros." : "Nada que mostrar aquí.")); return; }
  const completa = S.pestana === "ofertas" || S.pestana === "seguimiento";
  const pintarGrupo = lista => S.densidad === "compacta" ? [h("div", { class: "tabla-compacta" }, lista.map(filaCompacta))] : lista.map(o => tarjeta(o, completa));
  if (S.pestana !== "ofertas") { cont.replaceChildren(...pintarGrupo(filas)); return; }
  const porFuente = S.agrupar === "fuente", grupos = new Map();
  for (const o of filas) { const k = porFuente ? nombreFuente(o.fuente) : (o.prioridad || "sin prioridad"); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(o); }
  const orden = ["Alta", "Media", "Baja"];
  const claves = [...grupos.keys()].sort(porFuente ? (a, b) => grupos.get(b).length - grupos.get(a).length || a.localeCompare(b) : (a, b) => (orden.indexOf(a) + 1 || 9) - (orden.indexOf(b) + 1 || 9));
  cont.replaceChildren(...claves.flatMap(k => [h("h3", { class: "grupo" }, porFuente ? k : "Prioridad " + k, h("span", { class: "cuenta" }, grupos.get(k).length)), ...pintarGrupo(grupos.get(k))]));
}
function pintar() { pintarHistorial(); pintarEncabezado(); pintarPestanas(); pintarFiltros(); pintarLista(); }

// atajo: "/" o Ctrl+K enfocan el buscador (salvo que ya se esté escribiendo en un campo)
window.addEventListener("keydown", e => {
  const escribiendo = ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName);
  if ((e.key === "/" && !escribiendo) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault(); const b = document.querySelector(".filtros input[type=search]"); if (b) { b.focus(); b.select(); }
  }
});
pintar();
</script>
</body>
</html>
