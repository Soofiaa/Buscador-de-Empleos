    "description": "Sobre Nosotros\r\nDetrás de cada trabajador que recibe atención oportuna, de cada licencia que se procesa y de cada prestación que llega a tiempo, hay sistemas que se comunican entre sí sin fallar. Y para que eso ocurra, alguien tiene que asegurarse de que todo funcione antes de llegar a producción. En Muck Consultores llevamos más de 17 años conectando talento especializado con los proyectos tecnológicos más exigentes de Chile y Latinoamérica. Nos sumamos a los equipos de nuestros clientes desde adentro, como una extensión natural de su capacidad tecnológica, acompañando transformaciones que realmente importan.\r\n\r\nPropósito del Rol\r\nBuscamos un/a Analista QA para sumarse a un proyecto de alto impacto. Tu misión será certificar los desarrollos de integraciones entre sistemas, asegurando que cada conexión funcione de forma correcta, estable y confiable antes de pasar a producción. Si te gusta encontrar lo que otros no ven y eres de los que no deja pasar un detalle, este desafío es para ti.\r\n\r\nPrincipales Funciones\r\nPlanificar y diseñar estrategias, planes y casos de prueba para desarrollos de integraciones.\r\nEjecutar pruebas funcionales, de integración y de regresión.\r\nValidar el correcto funcionamiento de servicios y APIs entre sistemas.\r\nRegistrar, documentar y hacer seguimiento a incidencias junto al equipo de desarrollo.\r\nCertificar los desarrollos antes de su paso a producción.\r\nElaborar reportes de avance y resultados de pruebas.\r\nParticipar activamente en ceremonias ágiles junto al equipo.\r\n\r\nRequisitos\r\nTítulo en Ingeniería en Informática, Ingeniería de Ejecución en Informática, Analista Programador o carrera afín.\r\nAl menos 2 años de experiencia como Analista QA.\r\nExperiencia en planificación y ejecución de pruebas.\r\nExperiencia en diseño de casos de prueba y gestión de incidencias.\r\nConocimiento en pruebas de servicios y APIs (REST/SOAP).\r\n\r\nDeseables\r\nConocimiento en .NET.\r\nManejo de herramientas como Postman, SoapUI, Jira o Azure DevOps.\r\nExperiencia en automatización de pruebas.\r\nConocimiento en consultas SQL para validación de datos.\r\nExperiencia en proyectos del sector retail.\r\n\r\nHabilidades\r\nRigurosidad y atención al detalle.\r\nPensamiento analítico y orientación a la resolución de problemas.\r\nComunicación efectiva con equipos de desarrollo y negocio.\r\nTrabajo en equipo y colaboración.\r\nResponsabilidad y compromiso con la calidad.\r\n\r\nOfrecemos\r\nModalidad híbrida.\r\nBono de colación y movilización.\r\nSeguro complementario de salud.\r\nReajuste salarial por IPC anual.\r\nRenta competitiva acorde al mercado.\r\nContrato a plazo fijo, luego indefinido.\r\nDuración: un año con extensión.\r\nParticipación en un proyecto de alto impacto en el sector de salud.",
