name: job-tracker                      # fijo: si cambia, Docker crea otro volumen vacío y la base "desaparece"

services:
  jobtracker:
    build: .
    container_name: jobtracker
    restart: unless-stopped            # se vuelve a levantar solo (al reiniciar Windows, si Docker Desktop abre con la sesión)
    stop_grace_period: 15s             # SIGTERM -> cierre ordenado (respaldo en curso + -wal, ~8 s máx.) antes del SIGKILL
    ports:
      - "127.0.0.1:8765:8765"          # SOLO tu PC: nunca se publica hacia la red
    environment:
      - TZ=America/Santiago
      - JT_RESPALDOS=/respaldos
      - JOOBLE_KEY=${JOOBLE_KEY:-}          # clave de la API de Jooble (en .env, que no se sube a git)
    volumes:
      - jt_datos:/datos                # la base de datos (ofertas y estados) vive aquí, no en el contenedor
      # respaldos de la base en tu equipo, FUERA de OneDrive (OneDrive sincroniza C:/Users/sofia/OneDrive)
      - ${JT_RESPALDOS_HOST:-C:/Users/sofia/Respaldos/job-tracker}:/respaldos

volumes:
  jt_datos:
