<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búsqueda de empleo</title>
<style>
  /* Tipografías servidas por la propia app (web/fuentes, licencia SIL OFL 1.1): la CSP solo permite font-src 'self' */
  @font-face { font-family:"Plus Jakarta Sans"; src:url("/fuentes/plus-jakarta-sans-latin-wght-normal-5.3.0.woff2") format("woff2");
               font-weight:200 800; font-style:normal; font-display:swap; }
  @font-face { font-family:"Outfit"; src:url("/fuentes/outfit-latin-wght-normal-5.3.0.woff2") format("woff2");
               font-weight:100 900; font-style:normal; font-display:swap; }
  :root {
    --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: "Outfit", "Plus Jakarta Sans", sans-serif;
    color-scheme: light;
  }

  /* 🌸 1. GIRLY CLARO */
  :root[data-tema="girly-claro"], :root[data-tema="girly"], :root:not([data-tema]) {
    --fondo: #FFF5F8;
    --panel: #FFFFFF;
    --panel2: #FFEBF2;
    --borde: #F5D3E2;
    --tinta: #381E2B;
    --suave: #8F5972;
    --accion: #E04D7D;
    --accion-tinta: #FFFFFF;
    --sel: rgba(224, 77, 125, 0.12);
    --alta: #C73866;
    --alta-fondo: rgba(224, 77, 125, 0.14);
    --media: #8E44AD;
    --media-fondo: rgba(142, 68, 173, 0.12);
    --baja: #96697C;
    --baja-fondo: rgba(150, 105, 124, 0.12);
    --nueva: #D81B60;
    --nueva-fondo: rgba(216, 27, 96, 0.14);
    --aviso: #D97706;
    --aviso-fondo: rgba(217, 119, 6, 0.12);
    --rojo: #E11D48;
    --rojo-fondo: rgba(225, 29, 72, 0.10);
    color-scheme: light;
  }

  /* 🌺 2. GIRLY OSCURO (Aesthetic Dark Pink) */
  :root[data-tema="girly-oscuro"] {
    --fondo: #160D14;
    --panel: #231420;
    --panel2: #301D2D;
    --borde: #462940;
    --tinta: #FDE8F3;
    --suave: #C492B1;
    --accion: #F43F5E;
    --accion-tinta: #FFFFFF;
    --sel: rgba(244, 63, 94, 0.18);
    --alta: #FB7185;
    --alta-fondo: rgba(251, 113, 133, 0.16);
    --media: #D946EF;
    --media-fondo: rgba(217, 70, 239, 0.15);
    --baja: #A87193;
    --baja-fondo: rgba(168, 113, 147, 0.14);
    --nueva: #FDA4AF;
    --nueva-fondo: rgba(244, 63, 94, 0.20);
    --aviso: #FBBF24;
    --aviso-fondo: rgba(251, 191, 36, 0.14);
    --rojo: #F43F5E;
    --rojo-fondo: rgba(244, 63, 94, 0.15);
    color-scheme: dark;
  }

  /* 👔 3. HOMBRE CLARO */
  :root[data-tema="hombre-claro"] {
    --fondo: #F1F5F9;
    --panel: #FFFFFF;
    --panel2: #E2E8F0;
    --borde: #CBD5E1;
    --tinta: #0F172A;
    --suave: #475569;
    --accion: #1D4ED8;
    --accion-tinta: #FFFFFF;
    --sel: rgba(29, 78, 216, 0.12);
    --alta: #0284C7;
    --alta-fondo: rgba(2, 132, 199, 0.12);
    --media: #4F46E5;
    --media-fondo: rgba(79, 70, 229, 0.10);
    --baja: #64748B;
    --baja-fondo: rgba(100, 116, 139, 0.12);
    --nueva: #2563EB;
    --nueva-fondo: rgba(37, 99, 235, 0.14);
    --aviso: #D97706;
    --aviso-fondo: rgba(217, 119, 6, 0.12);
    --rojo: #DC2626;
    --rojo-fondo: rgba(220, 38, 38, 0.10);
    color-scheme: light;
  }

  /* 💼 4. HOMBRE OSCURO (Navy Slate) */
  :root[data-tema="hombre-oscuro"], :root[data-tema="hombre"] {
    --fondo: #0B1120;
    --panel: #151E2E;
    --panel2: #1E293B;
    --borde: #2D3D54;
    --tinta: #F1F5F9;
    --suave: #94A3B8;
    --accion: #3B82F6;
    --accion-tinta: #FFFFFF;
    --sel: rgba(59, 130, 246, 0.18);
    --alta: #38BDF8;
    --alta-fondo: rgba(56, 189, 248, 0.16);
    --media: #818CF8;
    --media-fondo: rgba(129, 140, 248, 0.14);
    --baja: #94A3B8;
    --baja-fondo: rgba(148, 163, 184, 0.12);
    --nueva: #60A5FA;
    --nueva-fondo: rgba(96, 165, 250, 0.18);
    --aviso: #FBBF24;
    --aviso-fondo: rgba(251, 191, 36, 0.14);
    --rojo: #F87171;
    --rojo-fondo: rgba(248, 113, 113, 0.14);
    color-scheme: dark;
  }

  /* ☀️ 5. NEUTRO CLARO */
  :root[data-tema="neutro-claro"], :root[data-tema="claro"] {
    --fondo: #F8FAFC;
    --panel: #FFFFFF;
    --panel2: #F1F5F9;
    --borde: #E2E8F0;
    --tinta: #0F172A;
    --suave: #64748B;
    --accion: #0EA5E9;
    --accion-tinta: #FFFFFF;
    --sel: rgba(14, 165, 233, 0.12);
    --alta: #B45309;
    --alta-fondo: rgba(245, 158, 11, 0.12);
    --media: #4338CA;
    --media-fondo: rgba(99, 102, 241, 0.10);
    --baja: #64748B;
    --baja-fondo: rgba(100, 116, 139, 0.10);
    --nueva: #0284C7;
    --nueva-fondo: rgba(14, 165, 233, 0.12);
    --aviso: #B45309;
    --aviso-fondo: rgba(245, 158, 11, 0.12);
    --rojo: #BE123C;
    --rojo-fondo: rgba(225, 29, 72, 0.08);
    color-scheme: light;
  }

  /* 🌙 6. NEUTRO OSCURO (Cyber Obsidian) */
  :root[data-tema="neutro-oscuro"], :root[data-tema="oscuro"] {
    --fondo: #111317;
    --panel: #1A1D24;
    --panel2: #242832;
    --borde: #303644;
    --tinta: #F3F4F6;
    --suave: #9CA3AF;
    --accion: #8B5CF6;
    --accion-tinta: #FFFFFF;
    --sel: rgba(139, 92, 246, 0.16);
    --alta: #FBBF24;
    --alta-fondo: rgba(251, 191, 36, 0.14);
    --media: #A78BFA;
    --media-fondo: rgba(167, 139, 250, 0.14);
    --baja: #9CA3AF;
    --baja-fondo: rgba(156, 163, 175, 0.12);
    --nueva: #C084FC;
    --nueva-fondo: rgba(192, 132, 252, 0.16);
    --aviso: #F59E0B;
    --aviso-fondo: rgba(245, 158, 11, 0.14);
    --rojo: #F87171;
    --rojo-fondo: rgba(248, 113, 113, 0.14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:var(--display); font-weight:700; letter-spacing:-0.025em; }
  button, select, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accion); outline-offset:2px; border-radius:6px; }
  .sub { color:var(--suave); font-size:.86rem; }

  /* ---------- dos columnas */
  .app { display:grid; grid-template-columns:304px minmax(0,1fr); min-height:100vh; }
  .lateral { background:var(--panel); border-right:1px solid var(--borde); padding:22px 16px 28px;
             position:sticky; top:0; height:100vh; overflow-y:auto; }
  .principal { padding:26px 36px 48px; width:100%; max-width:1600px; margin:0; box-sizing:border-box; min-width:0; }
  @media (max-width:860px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .lateral { position:static; height:auto; border-right:0; border-bottom:1px solid var(--borde); }
    .principal { padding:20px 16px 40px; }
  }

  /* ---------- columna izquierda */
  .marca { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .marca h1 { font-size:1.3rem; margin:0; }
  #ultima { margin:4px 0 16px; }
  .boton { background:var(--accion); color:var(--accion-tinta); border:0; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; }
  .boton:hover { filter:brightness(1.06); }
  .boton:disabled { opacity:.55; cursor:progress; }
  .boton.ancho { width:100%; }
  .boton.sec { background:transparent; color:var(--accion); border:1px solid var(--borde); font-weight:500; padding:5px 11px; font-size:.85rem; }
  .nota { color:var(--suave); font-size:.8rem; margin:6px 2px 10px; }
  .progreso { font-size:.84rem; color:var(--suave); min-height:1.2em; margin:0 2px 4px; overflow-wrap:anywhere; }
  .progreso.error { color:var(--rojo); }
  .barra { height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; margin:4px 2px 12px; }
  .barra-relleno { height:100%; width:0; background:var(--accion); border-radius:99px; transition:width .4s ease; }

  .historial { margin-top:14px; border-top:1px solid var(--borde); padding-top:12px; }
  .historial h2 { font-size:1rem; color:var(--suave); margin:4px 10px 8px; }
  .item { display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; background:none; border:0;
          border-radius:10px; padding:7px 10px; cursor:pointer; color:var(--tinta); }
  .item:hover { background:var(--panel2); }
  .item[aria-pressed="true"] { background:var(--sel); box-shadow:inset 3px 0 0 var(--accion); }
  .item:focus-visible { outline:1.5px solid var(--accion); outline-offset:-1.5px; border-radius:10px; }
  .item[aria-pressed="true"] .etq { color:var(--nueva); font-weight:650; }   /* --accion sobre --sel no llega a 4.5:1 en claro */
  .item .num { margin-left:auto; font-variant-numeric:tabular-nums; font-size:.84rem; color:var(--suave); }
  .item[aria-pressed="true"] .num { color:var(--tinta); }
  .item.todas { font-weight:600; margin-bottom:6px; }
  .dia { margin-top:8px; }
  .dia-btn .etq { font-weight:600; }
  .dia-btn .fecha { color:var(--suave); font-size:.8rem; }
  .horas { list-style:none; margin:2px 0 4px 10px; padding:0 0 0 8px; border-left:1px solid var(--borde); }
  .hora { font-size:.9rem; padding:5px 10px; }
  .hora .t { font-variant-numeric:tabular-nums; min-width:3.1em; }
  .hora .franja { color:var(--suave); font-size:.8rem; }
  .item.antes { margin-top:12px; color:var(--suave); }

  /* ---------- columna principal */
  .encabezado { margin-bottom:18px; }
  .encabezado-fila { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .btn-manual-header { background:var(--accion); color:var(--accion-tinta); border:0; border-radius:12px; padding:9px 18px; font-weight:700; font-size:.88rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow:0 2px 8px rgba(0,0,0,.10); transition:transform .15s ease, filter .15s ease; flex-shrink:0; }
  .btn-manual-header:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .titulo-sel { font-size:1.75rem; margin:0 0 2px; line-height:1.2; }
  .fuentes-sel { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; margin-top:14px; }
  .fuente-mini { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:10px 12px; }
  .fuente-mini .nombre { font-size:.82rem; color:var(--suave); }
  .fuente-mini .cifras { font-size:.9rem; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap; }
  .fuente-mini .cifras .rel { color:var(--accion); font-weight:650; }
  .fuente-mini .cifras .err { color:var(--aviso); }
  .fuente-mini .antiguas { font-size:.78rem; color:var(--suave); margin-top:1px; }
  details.panel { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:9px 14px; margin-top:14px; }
  details.panel summary { cursor:pointer; color:var(--suave); font-size:.88rem; }
  table.fuentes { border-collapse:collapse; width:100%; margin-top:8px; font-size:.86rem; }
  table.fuentes th, table.fuentes td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--borde); }
  table.fuentes th { color:var(--suave); font-weight:600; }
  .avisos li { color:var(--aviso); font-size:.86rem; }

  nav.pestanas { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--borde); margin-bottom:14px; }
  nav.pestanas button { background:none; border:0; border-bottom:3px solid transparent; padding:8px 12px; cursor:pointer; color:var(--suave); }
  nav.pestanas button:hover { color:var(--tinta); }
  nav.pestanas button[aria-selected="true"] { color:var(--tinta); border-bottom-color:var(--accion); font-weight:600; }
  .cuenta { font-size:.78rem; background:var(--panel2); color:var(--suave); border-radius:99px; padding:1px 8px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .filtros { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:16px; }
  @media (min-width:1300px) { .filtros { grid-template-columns:repeat(6,minmax(0,1fr)); } }
  .filtros input[type=search] { grid-column:1 / -1; }
  .filtros input, .filtros select { width:100%; background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:8px 11px; }
  .filtros select { font-size:.9rem; padding:8px 6px 8px 10px; text-overflow:ellipsis; }
  h3.grupo { font-size:1.08rem; margin:24px 0 10px; display:flex; align-items:center; gap:4px; }

  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:16px; padding:16px 20px; margin-bottom:12px; box-sizing:border-box; overflow:hidden; }
  .tarjeta.cerrada { opacity:.78; }
  .fila-titulo { display:flex; gap:14px; justify-content:space-between; align-items:flex-start; min-width:0; }
  .selector-tema { background:var(--panel2); color:var(--tinta); border:1px solid var(--borde); border-radius:10px; padding:6px 10px; font-size:0.83rem; font-weight:600; cursor:pointer; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  .selector-tema:hover, .selector-tema:focus-visible { border-color:var(--accion); }
  .titulo { flex:1 1 auto; min-width:0; font-family:var(--display); font-weight:650; font-size:1.12rem; line-height:1.35; color:var(--tinta); text-decoration:none; word-break:break-word; overflow-wrap:break-word; }
  .titulo:hover { color:var(--accion); text-decoration:underline; text-underline-offset:3px; }
  .meta { color:var(--suave); font-size:.86rem; margin:4px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .chip { font-size:.78rem; border-radius:99px; padding:2px 10px; background:var(--panel2); color:var(--tinta); }
  .chip.Alta { background:var(--alta-fondo); color:var(--alta); font-weight:600; }
  .chip.Media { background:var(--media-fondo); color:var(--media); font-weight:600; }
  .chip.Baja { background:var(--baja-fondo); color:var(--baja); font-weight:600; }
  .chip.aviso { background:var(--aviso-fondo); color:var(--aviso); }
  .chip.nueva { background:var(--nueva-fondo); color:var(--nueva); font-weight:600; }
  .motivo { font-size:.85rem; color:var(--suave); margin-top:8px; }
  .razon { font-size:.85rem; color:var(--rojo); margin-top:6px; }
  select.estado { flex-shrink:0; background:var(--panel2); color:var(--tinta); border:1px solid var(--borde); border-radius:10px; padding:6px 10px; font-size:.83rem; font-weight:600; max-width:175px; cursor:pointer; outline:none; box-sizing:border-box; transition:border-color .15s ease, box-shadow .15s ease; }
  select.estado:hover, select.estado:focus-visible { border-color:var(--accion); }
  .vacio { color:var(--suave); padding:28px 0; text-align:center; }
  @media (max-width:620px) { .fila-titulo { flex-direction:column; align-items:stretch; gap:8px; } select.estado { max-width:100%; width:100%; } .tarjeta { padding:14px 16px; } }

  /* ---------- panel de notas y bitácora */
  details.panel-nota { margin-top:10px; background:var(--panel2); border:1px solid var(--borde); border-radius:12px; padding:8px 12px; }
  details.panel-nota summary { cursor:pointer; font-weight:600; color:var(--suave); font-size:.84rem; list-style:none; display:flex; align-items:center; gap:6px; }
  details.panel-nota summary::-webkit-details-marker { display:none; }
  details.panel-nota summary:hover { color:var(--tinta); }
  .form-nota { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .fila-fecha-nota { display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--suave); }
  .input-fecha-nota { background:var(--panel); border:1px solid var(--borde); border-radius:8px; padding:4px 8px; font-size:.82rem; color:var(--tinta); }
  .input-nota { width:100%; min-height:60px; background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:8px 10px; font-size:.86rem; color:var(--tinta); resize:vertical; outline:none; transition:border-color .15s ease; box-sizing:border-box; }
  .input-nota:focus { border-color:var(--accion); }
  .acciones-nota { display:flex; align-items:center; justify-content:space-between; }
  .feedback-nota { font-size:.82rem; color:var(--nueva); font-weight:600; }

  /* ---------- modal manual */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.58); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .modal-tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:18px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 24px 48px rgba(0,0,0,.25); }
  .modal-cabecera { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-cabecera h2 { margin:0; font-size:1.25rem; font-family:var(--display); }
  .btn-cerrar { background:none; border:0; font-size:1.15rem; color:var(--suave); cursor:pointer; padding:4px 8px; border-radius:6px; }
  .btn-cerrar:hover { color:var(--tinta); }
  .modal-form { display:flex; flex-direction:column; gap:12px; }
  .form-fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px) { .form-fila { grid-template-columns:1fr; } }
  .form-grupo { display:flex; flex-direction:column; gap:4px; }
  .form-grupo label { font-size:.82rem; font-weight:600; color:var(--suave); }
  .form-grupo input, .form-grupo select, .form-grupo textarea { background:var(--panel2); border:1px solid var(--borde); border-radius:10px; padding:8px 11px; font-size:.88rem; color:var(--tinta); outline:none; transition:border-color .15s ease; }
  .form-grupo input:focus, .form-grupo select:focus, .form-grupo textarea:focus { border-color:var(--accion); }
  .form-grupo textarea { min-height:55px; resize:vertical; }
  .modal-acciones { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  /* ---------- métricas de embudo ---------- */
  .embudo-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:18px; }
  .embudo-card { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; transition:transform .15s ease, border-color .15s ease; }
  .embudo-card:hover { transform:translateY(-2px); border-color:var(--accion); }
  .embudo-card .etiqueta { font-size:.8rem; font-weight:600; color:var(--suave); display:flex; align-items:center; gap:6px; }
  .embudo-card .valor { font-size:1.5rem; font-weight:700; font-family:var(--display); color:var(--tinta); }

  /* ---------- vista kanban ---------- */
  .selector-vista { display:flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--borde); border-radius:10px; padding:3px; width:fit-content; }
  .btn-vista { background:none; border:0; border-radius:7px; padding:6px 11px; font-size:.82rem; font-weight:600; cursor:pointer; color:var(--suave); transition:all .15s ease; }
  .btn-vista[aria-pressed="true"] { background:var(--panel); color:var(--tinta); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .kanban-board { display:grid; grid-template-columns:repeat(4, minmax(260px, 1fr)); gap:14px; overflow-x:auto; padding-bottom:16px; align-items:start; }
  @media (max-width:1150px) { .kanban-board { grid-template-columns:repeat(4, 280px); } }
  .kanban-board .tarjeta { margin-bottom:0; padding:14px; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:8px; cursor:grab; transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease; user-select:none; }
  .kanban-board .tarjeta:active { cursor:grabbing; }
  .kanban-board .tarjeta.arrastrando { opacity:.35; transform:scale(.97); border:2px dashed var(--accion); box-shadow:none; }
  .kanban-col { background:var(--panel2); border:1px solid var(--borde); border-radius:16px; padding:14px 12px; display:flex; flex-direction:column; gap:12px; min-height:220px; transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease; }
  .kanban-col.zona-drop-activa { border-color:var(--accion); background:var(--sel); box-shadow:0 0 0 2px var(--accion); }

<div class="app">

        </div>
      </div>

    </header>

<script>
"use strict";
// <puras> — sin DOM ni estado global; tests/test_historial.py las ejecuta con Node
const CERRADOS = new Set(["postulada", "entrevista", "descartada"]);
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
const dosDig = n => String(n).padStart(2, "0");
const diaISO = f => f.getFullYear() + "-" + dosDig(f.getMonth() + 1) + "-" + dosDig(f.getDate());
const horaDe = t => (t || "").slice(11, 16);

function fechaLarga(dia) {                       // "2026-10-10" -> "Sábado 10 de octubre"
  const [a, m, d] = dia.split("-").map(Number);
  return mayus(DIAS[new Date(a, m - 1, d).getDay()]) + " " + d + " de " + MESES[m - 1];
}
function etiquetaDia(dia, hoy) {                 // hoy = "AAAA-MM-DD" según el reloj del navegador
  if (dia === hoy) return "Hoy";
  const [a, m, d] = hoy.split("-").map(Number);
  if (dia === diaISO(new Date(a, m - 1, d - 1))) return "Ayer";
  return fechaLarga(dia);
}
function franja(hhmm) {                         // 06:00–12:00 mañana, hasta 19:59 tarde, resto noche
  return hhmm >= "06:00" && hhmm <= "12:00" ? "mañana" : hhmm > "12:00" && hhmm <= "19:59" ? "tarde" : "noche";
}
function terminoRelativo(fin, hoy) {             // "2026-10-11 11:06" -> "hoy, terminó a las 11:06" / "ayer, terminó …"
  const dia = (fin || "").slice(0, 10), t = horaDe(fin), etq = etiquetaDia(dia, hoy);
  const cuando = etq === "Hoy" ? "hoy" : etq === "Ayer" ? "ayer" : "el " + etq.charAt(0).toLowerCase() + etq.slice(1);
  return cuando + ", terminó a las " + t;     // el historial muestra la hora de INICIO; aquí es la de término
}

function agruparPorDia(corridas) {               // [{dia, total, corridas}], el día más reciente primero
  const dias = new Map();
  for (const c of corridas || []) {
    const dia = (c.inicio || "").slice(0, 10);
    if (!dias.has(dia)) dias.set(dia, { dia, total: 0, corridas: [] });
    const g = dias.get(dia);
    g.total += c.nuevas || 0;
    g.corridas.push(c);
  }
  return [...dias.values()].sort((x, y) => x.dia < y.dia ? 1 : x.dia > y.dia ? -1 : 0);
}

// sel = {tipo:"todas"} | {tipo:"dia", dia} | {tipo:"hora", id} | {tipo:"antes"}
function idsSeleccion(sel, corridas) {           // null = no filtrar
  if (!sel || sel.tipo === "todas") return null;
  if (sel.tipo === "hora") return new Set([sel.id]);
  if (sel.tipo === "dia") return new Set((corridas || []).filter(c => (c.inicio || "").slice(0, 10) === sel.dia).map(c => c.id));
  if (sel.tipo === "antes") return new Set([null]);
  return null;
}
// Seguimiento y Descartadas son decisiones tuyas: muestran todo, sin importar qué búsqueda del historial está elegida
const SIN_FILTRO_HISTORIAL = new Set(["seguimiento", "descartadas_usuario"]);
function filtrarSeleccion(lista, pestana, sel, corridas) {
  if (SIN_FILTRO_HISTORIAL.has(pestana)) return lista;
  const ids = idsSeleccion(sel, corridas);
  return ids ? lista.filter(o => ids.has(o.corrida_id === undefined ? null : o.corrida_id)) : lista;
}
function listaDe(datos, pestana, sel) {
  if (!datos) return [];
  const base = pestana === "ofertas" ? datos.principal.filter(o => !CERRADOS.has(o.estado))
    : pestana === "seguimiento" ? datos.principal.filter(o => o.estado === "revisada" || o.estado === "postulada" || o.estado === "entrevista")
    : pestana === "descartadas_usuario" ? datos.principal.filter(o => o.estado === "descartada")
    : (datos[pestana] || []);
  return filtrarSeleccion(base, pestana, sel, datos.corridas);
}
function progresoDe(mensaje) {                   // "[12/40] ..." o "[bne 2/5] ..." -> {n, total, pct}
  const m = /\[(?:[^\[\]]*\s)?(\d+)\/(\d+)\]/.exec(mensaje || "");
  if (!m || !+m[2]) return null;
  const n = +m[1], total = +m[2];
  return { n, total, pct: Math.max(0, Math.min(100, Math.round(100 * n / total))) };
}
function tituloSeleccion(sel, corridas) {
  if (sel.tipo === "dia") return fechaLarga(sel.dia);
  if (sel.tipo === "hora") { const c = (corridas || []).find(x => x.id === sel.id); return "Búsqueda de las " + (c ? horaDe(c.inicio) : "?"); }
  if (sel.tipo === "antes") return "Antes del historial";
  return "Todas las ofertas";
}
const NOMBRE_FUENTE = { indeed: "Indeed", google: "Google", glassdoor: "Glassdoor", getonboard: "Get on Board",
  bne: "BNE", trabajando: "Trabajando", chiletrabajos: "Chiletrabajos", manual: "✍️ Manual" };
const nombreFuente = f => NOMBRE_FUENTE[f] || f || "sin fuente";
function textoProgreso(mensaje) {                // "[3/40] indeed | qa tester | …" -> "Buscando en Indeed · qa tester · 3 de 40"
  const m = /^\s*\[(\d+)\/(\d+)\]\s*([^|\[\]]+?)\s*\|\s*([^|:]+?)\s*(?:[|:]|$)/.exec(mensaje || "");
  return m ? "Buscando en " + nombreFuente(m[3]) + " · " + m[4] + " · " + m[1] + " de " + m[2] : (mensaje || "");
}
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function coincideTexto(o, texto) {             // cada palabra buscada debe estar en título, empresa, lugar, motivo o notas
  const t = norm([o.titulo, o.empresa, o.ubicacion, o.motivo, o.notas].join(" "));
  return (texto || "").split(/\s+/).every(w => t.includes(norm(w)));
}
function fechaCL(f) {                            // "2026-10-12" -> "12/10/2026"
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(f || ""));
  return m ? m[3] + "/" + m[2] + "/" + m[1] : (f || "");
}
function diasDesde(fecha, hoy) {                 // días enteros entre dos "AAAA-MM-DD" (null si falta la fecha)
  const a = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(fecha || "")), b = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(hoy || ""));
  if (!a || !b) return null;
  const dias = Math.round((Date.UTC(+b[1], b[2] - 1, +b[3]) - Date.UTC(+a[1], a[2] - 1, +a[3])) / 86400000);
  return Math.max(0, dias);
}
function textoSeguimiento(d) {                   // aviso de días desde la postulación: {texto, clase} o null
  if (d === null || d === undefined) return null;
  if (d === 0) return { texto: "⚡ Postulada hoy", clase: "ok" };
  if (d <= 3) return { texto: "🌱 Hace " + d + " d", clase: "ok" };
  if (d <= 5) return { texto: "⏱️ Hace " + d + " d (Revisar)", clase: "aviso" };
  return { texto: "⚠️ Hace " + d + " d · Toca follow-up", clase: "alerta" };
}
function esSueldoDestacado(sueldo) {
  if (!sueldo) return false;
  const s = String(sueldo).toLowerCase();
  return s !== "no indicado" && s !== "a convenir" && s !== "no especificado" && !s.includes("asignacion");
}
const SKILLS_CONOCIDAS = [
  "Python", "SQL", "APIs", "REST", "Jira", "Cypress", "Selenium", "QA", "Testing",
  "BPMN", "Postman", "Docker", "Git", "Java", "JavaScript", "TypeScript", "React",

function extraerSkills(o) {                      // hasta 5 tecnologías mencionadas en motivo, título o tipo
  const texto = ((o.motivo || "") + " " + (o.titulo || "") + " " + (o.tipo || "")).toLowerCase();
  const encontradas = [];
  for (const skill of SKILLS_CONOCIDAS) {
    const rx = new RegExp("(?:^|[^a-z0-9])" + skill.toLowerCase().replace(/[.+/]/g, "\\$&") + "(?:$|[^a-z0-9])", "i");
    if (rx.test(texto)) { encontradas.push(skill); if (encontradas.length >= 5) break; }
  }

}
const TEMAS = ["girly-claro", "girly-oscuro", "hombre-claro", "hombre-oscuro", "neutro-claro", "neutro-oscuro"];

  const antiguos = { girly: "girly-claro", hombre: "hombre-oscuro", oscuro: "neutro-oscuro", claro: "neutro-claro" };
  return antiguos[t] || (TEMAS.includes(t) ? t : "girly-claro");
}

async function api(ruta, cuerpo) {               // un fallo de red se devuelve como status 0, no como excepción
  try {
    const r = await fetch(ruta, cuerpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    return { ok: r.ok, status: r.status, json: await r.json().catch(() => ({})) };
  } catch (e) {
    return { ok: false, status: 0, json: {} };
  }
}

let sondeo = null;
function mostrarProgreso(e) {
  const p = $("progreso"), barra = $("barra");
  p.className = "progreso" + (e.error ? " error" : "");
  p.textContent = e.error ? "Error en la búsqueda: " + e.error : e.buscando ? textoProgreso(e.mensaje) : (e.mensaje || "");
  const pr = e.buscando && !e.error ? progresoDe(e.mensaje) : null;
  barra.hidden = !pr;
  if (pr) {
    $("barra-relleno").style.width = pr.pct + "%";
    barra.setAttribute("aria-valuemax", pr.total); barra.setAttribute("aria-valuenow", pr.n);
  }
  $("buscar").disabled = !!e.buscando;
}
async function estado() {
  const r = await api("/api/estado");
  if (!r.ok) { pintarEstadoDb(null); return; }
  const e = r.json;
  pintarEstadoDb(e);
  mostrarProgreso(e);
  S.ultima = e.corrida || null;
  pintarUltima();
  pintarEncabezado();
  if (e.buscando && !sondeo) {
    sondeo = setInterval(async () => {
      const x = await api("/api/estado");
      if (!x.ok) { pintarEstadoDb(null); return; }
      pintarEstadoDb(x.json);
      mostrarProgreso(x.json);
      if (!x.json.buscando) { clearInterval(sondeo); sondeo = null; cargar(); }
    }, 2500);
  }
}

      : h("span", { class: "sub ocultar-movil", style: "font-size:.75rem;" }, "—"),
    h("span", { class: "chip " + (o.prioridad || "Media") + " ocultar-movil", style: "font-size:.75rem;" }, o.prioridad || "Media"),
    h("span", { class: "sub ocultar-movil", style: "font-size:.78rem;" }, o.modalidad || "—"),
    selectorEstado(o, "Estado de seguimiento de " + (o.titulo || "la oferta")),
    h("a", { class: "btn-enlace-externo", href: url, target: "_blank", rel: "noopener noreferrer", title: "Abrir aviso", "aria-label": "Abrir aviso" }, "↗"));
}

function kpisSeguimiento() {                     // cifras reales del embudo de Seguimiento
  const p = (S.datos && S.datos.principal) || [];
  const final = o => o.fase === "oferta" || o.fase === "final";
  const tarjetaKpi = (etq, valor, estilo) => h("div", { class: "embudo-card", style: estilo || null },
    h("span", { class: "etiqueta" }, etq), h("span", { class: "valor", style: estilo ? estilo.replace("border-", "") : null }, valor));
  return h("div", { class: "embudo-grid" },
    tarjetaKpi("📌 Por Postular", p.filter(o => o.estado === "revisada").length),
    tarjetaKpi("✉️ CV Enviado", p.filter(o => o.estado === "postulada").length),
    tarjetaKpi("🎯 En Entrevista", p.filter(o => o.estado === "entrevista" && !final(o)).length, "border-color:var(--alta);"),
    tarjetaKpi("🏆 Oferta / Cierre", p.filter(o => o.estado === "entrevista" && final(o)).length, "border-color:var(--nueva);"));
}

function pintarLista() {
  const cont = $("lista");
  if (!S.datos) { cont.replaceChildren(h("div", { class: "vacio" }, "Cargando…")); return; }
  const filas = listaDe(S.datos, S.pestana, S.sel).filter(pasa);
  const completa = PESTANAS_PRINCIPAL.has(S.pestana);
  const pintarItems = lista => S.densidad === "compacta"
    ? [h("div", { class: "tabla-compacta" }, ...lista.map(filaCompacta))] : lista.map(o => tarjeta(o, completa));
  const cabecera = S.pestana === "seguimiento" ? [kpisSeguimiento()] : [];
  if (!filas.length) {
    const msj = S.sel.tipo !== "todas" && !SIN_FILTRO_HISTORIAL.has(S.pestana) ? "No hay ofertas de esta selección en esta pestaña."
      : S.pestana === "ofertas" ? "No hay ofertas con estos filtros. Prueba «Buscar empleos» o relaja los filtros."
      : S.pestana === "descartadas_usuario" ? "No tienes ofertas descartadas manualmente."
      : "Nada que mostrar aquí.";
    cont.replaceChildren(...cabecera, h("div", { class: "vacio" }, msj)); return;
  }
  if (S.pestana === "ofertas") {
    const porFuente = S.agrupar === "fuente", grupos = new Map();
    for (const o of filas) {
      const clave = porFuente ? nombreFuente(o.fuente) : (o.prioridad || "sin prioridad");
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(o);
    }
    const orden = ["Alta", "Media", "Baja"];
    const claves = [...grupos.keys()].sort(porFuente
      ? (a, b) => grupos.get(b).length - grupos.get(a).length || a.localeCompare(b)
      : (a, b) => (orden.indexOf(a) + 1 || 9) - (orden.indexOf(b) + 1 || 9));
    cont.replaceChildren(...claves.flatMap(k => [
      h("h3", { class: "grupo" }, porFuente ? k : "Prioridad " + k, h("span", { class: "cuenta" }, grupos.get(k).length)),
      ...pintarItems(grupos.get(k))]));
    return;
  }
  let nota = null;
  if (S.pestana === "descartadas" && S.datos.total_descartadas > S.datos.descartadas.length)
    nota = h("p", { class: "sub" }, S.sel.tipo === "todas"
      ? "Se muestran las " + S.datos.descartadas.length + " más recientes de " + S.datos.total_descartadas + "."
      : "Se buscan entre las " + S.datos.descartadas.length + " descartadas más recientes (de " + S.datos.total_descartadas + ").");
  cont.replaceChildren(...cabecera, ...[nota].filter(Boolean), ...pintarItems(filas));
}

function pintar() { pintarHistorial(); pintarEncabezado(); pintarPestanas(); pintarFiltros(); pintarLista(); }

// atajo global: "/" o Ctrl+K llevan al buscador
window.addEventListener("keydown", e => {
  const activo = document.activeElement;
  const escribiendo = activo && ["INPUT", "TEXTAREA", "SELECT"].includes(activo.tagName);
  if ((e.key === "/" && !escribiendo) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault();
    const buscador = document.querySelector(".filtros input[type=search]");
    if (buscador) { buscador.focus(); buscador.select(); }
  }
});

cargar();
</script>
