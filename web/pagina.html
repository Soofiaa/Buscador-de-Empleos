<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búsqueda de empleo</title>
<style>
  /* Tipografías servidas por la propia app (web/fuentes, licencia SIL OFL 1.1): la CSP solo permite font-src 'self' */
  @font-face { font-family:"Plus Jakarta Sans"; src:url("/fuentes/plus-jakarta-sans-latin-wght-normal-5.3.0.woff2") format("woff2");
               font-weight:200 800; font-style:normal; font-display:swap; }
  @font-face { font-family:"Outfit"; src:url("/fuentes/outfit-latin-wght-normal-5.3.0.woff2") format("woff2");
               font-weight:100 900; font-style:normal; font-display:swap; }
  :root {
    --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: "Outfit", "Plus Jakarta Sans", sans-serif;
    color-scheme: light;
  }

  /* 🌸 1. GIRLY CLARO */
  :root[data-tema="girly-claro"], :root[data-tema="girly"], :root:not([data-tema]) {
    --fondo: #FFF5F8;
    --panel: #FFFFFF;
    --panel2: #FFEBF2;
    --borde: #F5D3E2;
    --tinta: #381E2B;
    --suave: #8F5972;
    --accion: #E04D7D;
    --accion-tinta: #FFFFFF;
    --sel: rgba(224, 77, 125, 0.12);
    --alta: #C73866;
    --alta-fondo: rgba(224, 77, 125, 0.14);
    --media: #8E44AD;
    --media-fondo: rgba(142, 68, 173, 0.12);
    --baja: #96697C;
    --baja-fondo: rgba(150, 105, 124, 0.12);
    --nueva: #D81B60;
    --nueva-fondo: rgba(216, 27, 96, 0.14);
    --aviso: #D97706;
    --aviso-fondo: rgba(217, 119, 6, 0.12);
    --rojo: #E11D48;
    --rojo-fondo: rgba(225, 29, 72, 0.10);
    color-scheme: light;
  }

  /* 🌺 2. GIRLY OSCURO (Aesthetic Dark Pink) */
  :root[data-tema="girly-oscuro"] {
    --fondo: #160D14;
    --panel: #231420;
    --panel2: #301D2D;
    --borde: #462940;
    --tinta: #FDE8F3;
    --suave: #C492B1;
    --accion: #F43F5E;
    --accion-tinta: #FFFFFF;
    --sel: rgba(244, 63, 94, 0.18);
    --alta: #FB7185;
    --alta-fondo: rgba(251, 113, 133, 0.16);
    --media: #D946EF;
    --media-fondo: rgba(217, 70, 239, 0.15);
    --baja: #A87193;
    --baja-fondo: rgba(168, 113, 147, 0.14);
    --nueva: #FDA4AF;
    --nueva-fondo: rgba(244, 63, 94, 0.20);
    --aviso: #FBBF24;
    --aviso-fondo: rgba(251, 191, 36, 0.14);
    --rojo: #F43F5E;
    --rojo-fondo: rgba(244, 63, 94, 0.15);
    color-scheme: dark;
  }

  /* 👔 3. HOMBRE CLARO */
  :root[data-tema="hombre-claro"] {
    --fondo: #F1F5F9;
    --panel: #FFFFFF;
    --panel2: #E2E8F0;
    --borde: #CBD5E1;
    --tinta: #0F172A;
    --suave: #475569;
    --accion: #1D4ED8;
    --accion-tinta: #FFFFFF;
    --sel: rgba(29, 78, 216, 0.12);
    --alta: #0284C7;
    --alta-fondo: rgba(2, 132, 199, 0.12);
    --media: #4F46E5;
    --media-fondo: rgba(79, 70, 229, 0.10);
    --baja: #64748B;
    --baja-fondo: rgba(100, 116, 139, 0.12);
    --nueva: #2563EB;
    --nueva-fondo: rgba(37, 99, 235, 0.14);
    --aviso: #D97706;
    --aviso-fondo: rgba(217, 119, 6, 0.12);
    --rojo: #DC2626;
    --rojo-fondo: rgba(220, 38, 38, 0.10);
    color-scheme: light;
  }

  /* 💼 4. HOMBRE OSCURO (Navy Slate) */
  :root[data-tema="hombre-oscuro"], :root[data-tema="hombre"] {
    --fondo: #0B1120;
    --panel: #151E2E;
    --panel2: #1E293B;
    --borde: #2D3D54;
    --tinta: #F1F5F9;
    --suave: #94A3B8;
    --accion: #3B82F6;
    --accion-tinta: #FFFFFF;
    --sel: rgba(59, 130, 246, 0.18);
    --alta: #38BDF8;
    --alta-fondo: rgba(56, 189, 248, 0.16);
    --media: #818CF8;
    --media-fondo: rgba(129, 140, 248, 0.14);
    --baja: #94A3B8;
    --baja-fondo: rgba(148, 163, 184, 0.12);
    --nueva: #60A5FA;
    --nueva-fondo: rgba(96, 165, 250, 0.18);
    --aviso: #FBBF24;
    --aviso-fondo: rgba(251, 191, 36, 0.14);
    --rojo: #F87171;
    --rojo-fondo: rgba(248, 113, 113, 0.14);
    color-scheme: dark;
  }

  /* ☀️ 5. NEUTRO CLARO */
  :root[data-tema="neutro-claro"], :root[data-tema="claro"] {
    --fondo: #F8FAFC;
    --panel: #FFFFFF;
    --panel2: #F1F5F9;
    --borde: #E2E8F0;
    --tinta: #0F172A;
    --suave: #64748B;
    --accion: #0EA5E9;
    --accion-tinta: #FFFFFF;
    --sel: rgba(14, 165, 233, 0.12);
    --alta: #B45309;
    --alta-fondo: rgba(245, 158, 11, 0.12);
    --media: #4338CA;
    --media-fondo: rgba(99, 102, 241, 0.10);
    --baja: #64748B;
    --baja-fondo: rgba(100, 116, 139, 0.10);
    --nueva: #0284C7;
    --nueva-fondo: rgba(14, 165, 233, 0.12);
    --aviso: #B45309;
    --aviso-fondo: rgba(245, 158, 11, 0.12);
    --rojo: #BE123C;
    --rojo-fondo: rgba(225, 29, 72, 0.08);
    color-scheme: light;
  }

  /* 🌙 6. NEUTRO OSCURO (Cyber Obsidian) */
  :root[data-tema="neutro-oscuro"], :root[data-tema="oscuro"] {
    --fondo: #111317;
    --panel: #1A1D24;
    --panel2: #242832;
    --borde: #303644;
    --tinta: #F3F4F6;
    --suave: #9CA3AF;
    --accion: #8B5CF6;
    --accion-tinta: #FFFFFF;
    --sel: rgba(139, 92, 246, 0.16);
    --alta: #FBBF24;
    --alta-fondo: rgba(251, 191, 36, 0.14);
    --media: #A78BFA;
    --media-fondo: rgba(167, 139, 250, 0.14);
    --baja: #9CA3AF;
    --baja-fondo: rgba(156, 163, 175, 0.12);
    --nueva: #C084FC;
    --nueva-fondo: rgba(192, 132, 252, 0.16);
    --aviso: #F59E0B;
    --aviso-fondo: rgba(245, 158, 11, 0.14);
    --rojo: #F87171;
    --rojo-fondo: rgba(248, 113, 113, 0.14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:var(--display); font-weight:700; letter-spacing:-0.025em; }
  button, select, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accion); outline-offset:2px; border-radius:6px; }
  .sub { color:var(--suave); font-size:.86rem; }

  /* ---------- dos columnas */
  .app { display:grid; grid-template-columns:304px minmax(0,1fr); min-height:100vh; }
  .lateral { background:var(--panel); border-right:1px solid var(--borde); padding:22px 16px 28px;
             position:sticky; top:0; height:100vh; overflow-y:auto; }
  .principal { padding:26px 36px 48px; width:100%; max-width:1600px; margin:0; box-sizing:border-box; min-width:0; }
  @media (max-width:860px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .lateral { position:static; height:auto; border-right:0; border-bottom:1px solid var(--borde); }
    .principal { padding:20px 16px 40px; }
  }

  /* ---------- columna izquierda */
  .marca { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .marca h1 { font-size:1.3rem; margin:0; }
  #ultima { margin:4px 0 16px; }
  .boton { background:var(--accion); color:var(--accion-tinta); border:0; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; }
  .boton:hover { filter:brightness(1.06); }
  .boton:disabled { opacity:.55; cursor:progress; }
  .boton.ancho { width:100%; }
  .boton.sec { background:transparent; color:var(--accion); border:1px solid var(--borde); font-weight:500; padding:5px 11px; font-size:.85rem; }
  .nota { color:var(--suave); font-size:.8rem; margin:6px 2px 10px; }
  .progreso { font-size:.84rem; color:var(--suave); min-height:1.2em; margin:0 2px 4px; overflow-wrap:anywhere; }
  .progreso.error { color:var(--rojo); }
  .barra { height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; margin:4px 2px 12px; }
  .barra-relleno { height:100%; width:0; background:var(--accion); border-radius:99px; transition:width .4s ease; }

  .historial { margin-top:14px; border-top:1px solid var(--borde); padding-top:12px; }
  .historial h2 { font-size:1rem; color:var(--suave); margin:4px 10px 8px; }
  .item { display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; background:none; border:0;
          border-radius:10px; padding:7px 10px; cursor:pointer; color:var(--tinta); }
  .item:hover { background:var(--panel2); }
  .item[aria-pressed="true"] { background:var(--sel); box-shadow:inset 3px 0 0 var(--accion); }
  .item:focus-visible { outline:1.5px solid var(--accion); outline-offset:-1.5px; border-radius:10px; }
  .item[aria-pressed="true"] .etq { color:var(--nueva); font-weight:650; }   /* --accion sobre --sel no llega a 4.5:1 en claro */
  .item .num { margin-left:auto; font-variant-numeric:tabular-nums; font-size:.84rem; color:var(--suave); }
  .item[aria-pressed="true"] .num { color:var(--tinta); }
  .item.todas { font-weight:600; margin-bottom:6px; }
  .dia { margin-top:8px; }
  .dia-btn .etq { font-weight:600; }
  .dia-btn .fecha { color:var(--suave); font-size:.8rem; }
  .horas { list-style:none; margin:2px 0 4px 10px; padding:0 0 0 8px; border-left:1px solid var(--borde); }
  .hora { font-size:.9rem; padding:5px 10px; }
  .hora .t { font-variant-numeric:tabular-nums; min-width:3.1em; }
  .hora .franja { color:var(--suave); font-size:.8rem; }
  .item.antes { margin-top:12px; color:var(--suave); }

  /* ---------- columna principal */
  .encabezado { margin-bottom:18px; }
  .encabezado-fila { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .btn-manual-header { background:var(--accion); color:var(--accion-tinta); border:0; border-radius:12px; padding:9px 18px; font-weight:700; font-size:.88rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow:0 2px 8px rgba(0,0,0,.10); transition:transform .15s ease, filter .15s ease; flex-shrink:0; }
  .btn-manual-header:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .titulo-sel { font-size:1.75rem; margin:0 0 2px; line-height:1.2; }
  .fuentes-sel { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; margin-top:14px; }
  .fuente-mini { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:10px 12px; }
  .fuente-mini .nombre { font-size:.82rem; color:var(--suave); }
  .fuente-mini .cifras { font-size:.9rem; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap; }
  .fuente-mini .cifras .rel { color:var(--accion); font-weight:650; }
  .fuente-mini .cifras .err { color:var(--aviso); }
  .fuente-mini .antiguas { font-size:.78rem; color:var(--suave); margin-top:1px; }
  details.panel { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:9px 14px; margin-top:14px; }
  details.panel summary { cursor:pointer; color:var(--suave); font-size:.88rem; }
  table.fuentes { border-collapse:collapse; width:100%; margin-top:8px; font-size:.86rem; }
  table.fuentes th, table.fuentes td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--borde); }
  table.fuentes th { color:var(--suave); font-weight:600; }
  .avisos li { color:var(--aviso); font-size:.86rem; }

  nav.pestanas { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--borde); margin-bottom:14px; }
  nav.pestanas button { background:none; border:0; border-bottom:3px solid transparent; padding:8px 12px; cursor:pointer; color:var(--suave); }
  nav.pestanas button:hover { color:var(--tinta); }
  nav.pestanas button[aria-selected="true"] { color:var(--tinta); border-bottom-color:var(--accion); font-weight:600; }
  .cuenta { font-size:.78rem; background:var(--panel2); color:var(--suave); border-radius:99px; padding:1px 8px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .filtros { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:16px; }
  @media (min-width:1300px) { .filtros { grid-template-columns:repeat(6,minmax(0,1fr)); } }
  .filtros input[type=search] { grid-column:1 / -1; }
  .filtros input, .filtros select { width:100%; background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:8px 11px; }
  .filtros select { font-size:.9rem; padding:8px 6px 8px 10px; text-overflow:ellipsis; }
  h3.grupo { font-size:1.08rem; margin:24px 0 10px; display:flex; align-items:center; gap:4px; }

  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:16px; padding:16px 20px; margin-bottom:12px; box-sizing:border-box; overflow:hidden; }
  .tarjeta.cerrada { opacity:.78; }
  .fila-titulo { display:flex; gap:14px; justify-content:space-between; align-items:flex-start; min-width:0; }
  .selector-tema { background:var(--panel2); color:var(--tinta); border:1px solid var(--borde); border-radius:10px; padding:6px 10px; font-size:0.83rem; font-weight:600; cursor:pointer; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  .selector-tema:hover, .selector-tema:focus-visible { border-color:var(--accion); }
  .titulo { flex:1 1 auto; min-width:0; font-family:var(--display); font-weight:650; font-size:1.12rem; line-height:1.35; color:var(--tinta); text-decoration:none; word-break:break-word; overflow-wrap:break-word; }
  .titulo:hover { color:var(--accion); text-decoration:underline; text-underline-offset:3px; }
  .meta { color:var(--suave); font-size:.86rem; margin:4px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .chip { font-size:.78rem; border-radius:99px; padding:2px 10px; background:var(--panel2); color:var(--tinta); }
  .chip.Alta { background:var(--alta-fondo); color:var(--alta); font-weight:600; }
  .chip.Media { background:var(--media-fondo); color:var(--media); font-weight:600; }
  .chip.Baja { background:var(--baja-fondo); color:var(--baja); font-weight:600; }
  .chip.aviso { background:var(--aviso-fondo); color:var(--aviso); }
  .chip.nueva { background:var(--nueva-fondo); color:var(--nueva); font-weight:600; }
  .motivo { font-size:.85rem; color:var(--suave); margin-top:8px; }
  .razon { font-size:.85rem; color:var(--rojo); margin-top:6px; }
  select.estado { flex-shrink:0; background:var(--panel2); color:var(--tinta); border:1px solid var(--borde); border-radius:10px; padding:6px 10px; font-size:.83rem; font-weight:600; max-width:175px; cursor:pointer; outline:none; box-sizing:border-box; transition:border-color .15s ease, box-shadow .15s ease; }
  select.estado:hover, select.estado:focus-visible { border-color:var(--accion); }
  .vacio { color:var(--suave); padding:28px 0; text-align:center; }
  @media (max-width:620px) { .fila-titulo { flex-direction:column; align-items:stretch; gap:8px; } select.estado { max-width:100%; width:100%; } .tarjeta { padding:14px 16px; } }

  /* ---------- panel de notas y bitácora */
  details.panel-nota { margin-top:10px; background:var(--panel2); border:1px solid var(--borde); border-radius:12px; padding:8px 12px; }
  details.panel-nota summary { cursor:pointer; font-weight:600; color:var(--suave); font-size:.84rem; list-style:none; display:flex; align-items:center; gap:6px; }
  details.panel-nota summary::-webkit-details-marker { display:none; }
  details.panel-nota summary:hover { color:var(--tinta); }
  .form-nota { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .fila-fecha-nota { display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--suave); }
  .input-fecha-nota { background:var(--panel); border:1px solid var(--borde); border-radius:8px; padding:4px 8px; font-size:.82rem; color:var(--tinta); }
  .input-nota { width:100%; min-height:60px; background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:8px 10px; font-size:.86rem; color:var(--tinta); resize:vertical; outline:none; transition:border-color .15s ease; box-sizing:border-box; }
  .input-nota:focus { border-color:var(--accion); }
  .acciones-nota { display:flex; align-items:center; justify-content:space-between; }
  .feedback-nota { font-size:.82rem; color:var(--nueva); font-weight:600; }

  /* ---------- modal manual */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.58); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .modal-tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:18px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 24px 48px rgba(0,0,0,.25); }
  .modal-cabecera { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-cabecera h2 { margin:0; font-size:1.25rem; font-family:var(--display); }
  .btn-cerrar { background:none; border:0; font-size:1.15rem; color:var(--suave); cursor:pointer; padding:4px 8px; border-radius:6px; }
  .btn-cerrar:hover { color:var(--tinta); }
  .modal-form { display:flex; flex-direction:column; gap:12px; }
  .form-fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px) { .form-fila { grid-template-columns:1fr; } }
  .form-grupo { display:flex; flex-direction:column; gap:4px; }
  .form-grupo label { font-size:.82rem; font-weight:600; color:var(--suave); }
  .form-grupo input, .form-grupo select, .form-grupo textarea { background:var(--panel2); border:1px solid var(--borde); border-radius:10px; padding:8px 11px; font-size:.88rem; color:var(--tinta); outline:none; transition:border-color .15s ease; }
  .form-grupo input:focus, .form-grupo select:focus, .form-grupo textarea:focus { border-color:var(--accion); }
  .form-grupo textarea { min-height:55px; resize:vertical; }
  .modal-acciones { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  /* ---------- métricas de embudo ---------- */
  .embudo-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:18px; }
  .embudo-card { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; transition:transform .15s ease, border-color .15s ease; }
  .embudo-card:hover { transform:translateY(-2px); border-color:var(--accion); }
  .embudo-card .etiqueta { font-size:.8rem; font-weight:600; color:var(--suave); display:flex; align-items:center; gap:6px; }
  .embudo-card .valor { font-size:1.5rem; font-weight:700; font-family:var(--display); color:var(--tinta); }

  /* ---------- vista kanban ---------- */
  .selector-vista { display:flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--borde); border-radius:10px; padding:3px; width:fit-content; }
  .btn-vista { background:none; border:0; border-radius:7px; padding:6px 11px; font-size:.82rem; font-weight:600; cursor:pointer; color:var(--suave); transition:all .15s ease; }
  .btn-vista[aria-pressed="true"] { background:var(--panel); color:var(--tinta); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .kanban-board { display:grid; grid-template-columns:repeat(4, minmax(260px, 1fr)); gap:14px; overflow-x:auto; padding-bottom:16px; align-items:start; }
  @media (max-width:1150px) { .kanban-board { grid-template-columns:repeat(4, 280px); } }
  .kanban-board .tarjeta { margin-bottom:0; padding:14px 12px; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:8px; cursor:grab; transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease; user-select:none; }
  .kanban-board .tarjeta:active { cursor:grabbing; }
  .kanban-board .tarjeta.arrastrando { opacity:.35; transform:scale(.97); border:2px dashed var(--accion); box-shadow:none; }
  .kanban-col { background:var(--panel2); border:1px solid var(--borde); border-radius:16px; padding:14px 10px; display:flex; flex-direction:column; gap:12px; min-height:220px; transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease; }
  .kanban-col.zona-drop-activa { border-color:var(--accion); background:var(--sel); box-shadow:0 0 0 2px var(--accion); }

<div class="app">
  <aside class="lateral">
    <div class="marca">

      <select class="selector-tema" id="tema" aria-label="Elegir tema visual">

          <option value="girly-claro">🌸 Girly Claro</option>

        </optgroup>
        <optgroup label="👔 Estilo Hombre">

          <option value="hombre-oscuro">💼 Hombre Oscuro</option>
        </optgroup>

          <option value="neutro-oscuro">🌙 Neutro Oscuro</option>

      </select>
    </div>

      <button class="boton ancho" id="buscar" type="button">Buscar empleos</button>
      <p class="nota">Búsqueda completa (~5 min) en Indeed, Chiletrabajos, BNE, etc.</p>
      <div class="progreso" id="progreso" role="status" aria-live="polite"></div>
      <div class="barra" id="barra" role="progressbar" aria-label="Avance de la búsqueda" aria-valuemin="0" hidden><div class="barra-relleno" id="barra-relleno"></div></div>
    </div>

      <div class="acciones-datos" style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="boton sec" id="btn-exportar-csv" type="button" title="Descargar la pestaña actual (Seguimiento u Ofertas) para Excel" style="font-size:.78rem; padding:7px 4px; justify-content:center;">📥 CSV / Excel</button>
        <button class="boton sec" id="btn-exportar-json" type="button" title="Descargar todas las ofertas en JSON (respaldo legible)" style="font-size:.78rem; padding:7px 4px; justify-content:center;">📦 Respaldo JSON</button>
      </div>
      <button class="boton sec ancho" id="btn-respaldo" type="button" title="Copia exacta de la base a tu carpeta de respaldos" style="margin-top:6px; font-size:.8rem; padding:7px 8px; justify-content:center;">💾 Respaldar ahora</button>
      <div class="sub" id="estado-respaldo" role="status" style="margin:6px 2px 0; font-size:.78rem;"></div>
    </div>

    <nav class="historial" id="historial" aria-label="Historial de búsquedas"></nav>

    </header>
    <nav class="pestanas" id="pestanas" role="tablist" aria-label="Categorías de ofertas"></nav>

    <div id="lista"></div>

<script>
"use strict";
// <puras> — sin DOM ni estado global; tests/test_historial.py las ejecuta con Node
const CERRADOS = new Set(["postulada", "entrevista", "descartada"]);
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
const dosDig = n => String(n).padStart(2, "0");
const diaISO = f => f.getFullYear() + "-" + dosDig(f.getMonth() + 1) + "-" + dosDig(f.getDate());
const horaDe = t => (t || "").slice(11, 16);

function fechaLarga(dia) {                       // "2026-10-10" -> "Sábado 10 de octubre"
  const [a, m, d] = dia.split("-").map(Number);
  return mayus(DIAS[new Date(a, m - 1, d).getDay()]) + " " + d + " de " + MESES[m - 1];
}
function etiquetaDia(dia, hoy) {                 // hoy = "AAAA-MM-DD" según el reloj del navegador
  if (dia === hoy) return "Hoy";
  const [a, m, d] = hoy.split("-").map(Number);
  if (dia === diaISO(new Date(a, m - 1, d - 1))) return "Ayer";
  return fechaLarga(dia);
}
function franja(hhmm) {                         // 06:00–12:00 mañana, hasta 19:59 tarde, resto noche
  return hhmm >= "06:00" && hhmm <= "12:00" ? "mañana" : hhmm > "12:00" && hhmm <= "19:59" ? "tarde" : "noche";
}
function terminoRelativo(fin, hoy) {             // "2026-10-11 11:06" -> "hoy, terminó a las 11:06" / "ayer, terminó …"
  const dia = (fin || "").slice(0, 10), t = horaDe(fin), etq = etiquetaDia(dia, hoy);
  const cuando = etq === "Hoy" ? "hoy" : etq === "Ayer" ? "ayer" : "el " + etq.charAt(0).toLowerCase() + etq.slice(1);
  return cuando + ", terminó a las " + t;     // el historial muestra la hora de INICIO; aquí es la de término
}

function agruparPorDia(corridas) {               // [{dia, total, corridas}], el día más reciente primero
  const dias = new Map();
  for (const c of corridas || []) {
    const dia = (c.inicio || "").slice(0, 10);
    if (!dias.has(dia)) dias.set(dia, { dia, total: 0, corridas: [] });
    const g = dias.get(dia);
    g.total += c.nuevas || 0;
    g.corridas.push(c);
  }
  return [...dias.values()].sort((x, y) => x.dia < y.dia ? 1 : x.dia > y.dia ? -1 : 0);
}

// sel = {tipo:"todas"} | {tipo:"dia", dia} | {tipo:"hora", id} | {tipo:"antes"}
function idsSeleccion(sel, corridas) {           // null = no filtrar
  if (!sel || sel.tipo === "todas") return null;
  if (sel.tipo === "hora") return new Set([sel.id]);
  if (sel.tipo === "dia") return new Set((corridas || []).filter(c => (c.inicio || "").slice(0, 10) === sel.dia).map(c => c.id));
  if (sel.tipo === "antes") return new Set([null]);
  return null;
}
// Seguimiento y Descartadas son decisiones tuyas: muestran todo, sin importar qué búsqueda del historial está elegida
const SIN_FILTRO_HISTORIAL = new Set(["seguimiento", "descartadas_usuario"]);
function filtrarSeleccion(lista, pestana, sel, corridas) {
  if (SIN_FILTRO_HISTORIAL.has(pestana)) return lista;
  const ids = idsSeleccion(sel, corridas);
  return ids ? lista.filter(o => ids.has(o.corrida_id === undefined ? null : o.corrida_id)) : lista;
}
function listaDe(datos, pestana, sel) {
  if (!datos) return [];
  const base = pestana === "ofertas" ? datos.principal.filter(o => !CERRADOS.has(o.estado))
    : pestana === "seguimiento" ? datos.principal.filter(o => o.estado === "revisada" || o.estado === "postulada" || o.estado === "entrevista")
    : pestana === "descartadas_usuario" ? datos.principal.filter(o => o.estado === "descartada")
    : (datos[pestana] || []);
  return filtrarSeleccion(base, pestana, sel, datos.corridas);
}
function progresoDe(mensaje) {                   // "[12/40] ..." o "[bne 2/5] ..." -> {n, total, pct}
  const m = /\[(?:[^\[\]]*\s)?(\d+)\/(\d+)\]/.exec(mensaje || "");
  if (!m || !+m[2]) return null;
  const n = +m[1], total = +m[2];
  return { n, total, pct: Math.max(0, Math.min(100, Math.round(100 * n / total))) };
}
function tituloSeleccion(sel, corridas) {
  if (sel.tipo === "dia") return fechaLarga(sel.dia);
  if (sel.tipo === "hora") { const c = (corridas || []).find(x => x.id === sel.id); return "Búsqueda de las " + (c ? horaDe(c.inicio) : "?"); }
  if (sel.tipo === "antes") return "Antes del historial";
  return "Todas las ofertas";
}
const NOMBRE_FUENTE = { indeed: "Indeed", google: "Google", glassdoor: "Glassdoor", getonboard: "Get on Board",
  bne: "BNE", trabajando: "Trabajando", chiletrabajos: "Chiletrabajos", linkedin: "LinkedIn", manual: "✍️ Manual" };

function h(tag, attrs, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);

}

async function api(ruta, cuerpo) {               // un fallo de red se devuelve como status 0, no como excepción
  try {
    const r = await fetch(ruta, cuerpo === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    return { ok: r.ok, status: r.status, json: await r.json().catch(() => ({})) };
  } catch (e) {
    return { ok: false, status: 0, json: {} };
  }
}

function mostrarProgreso(e) {

  p.textContent = e.error ? "Error en la búsqueda: " + e.error : e.buscando ? textoProgreso(e.mensaje) : (e.mensaje || "");
  const pr = e.buscando && !e.error ? progresoDe(e.mensaje) : null;
  barra.hidden = !pr;
  if (pr) {
    $("barra-relleno").style.width = pr.pct + "%";
    barra.setAttribute("aria-valuemax", pr.total); barra.setAttribute("aria-valuenow", pr.n);
  }
  $("buscar").disabled = !!e.buscando;
}
async function estado() {
  const r = await api("/api/estado");
  if (!r.ok) { pintarEstadoDb(null); return; }
  const e = r.json;
  pintarEstadoDb(e);
  pintarRespaldo(e.respaldo);
  mostrarProgreso(e);
  S.ultima = e.corrida || null;
  pintarUltima();
  pintarEncabezado();
  if (e.buscando && !sondeo) {
    sondeo = setInterval(async () => {
      const x = await api("/api/estado");
      if (!x.ok) { pintarEstadoDb(null); return; }
      pintarEstadoDb(x.json);
      mostrarProgreso(x.json);
      if (!x.json.buscando) { clearInterval(sondeo); sondeo = null; cargar(); }
    }, 2500);
  }
}

// ---------- cambio de estado y fase (una sola escritura), con deshacer exacto (estado, fase y fecha anteriores)
// en_fase_desde se reinicia en memoria igual que en el servidor: solo si cambia estado o fase; deshacer lo devuelve
function aplicarSeguimiento(o, s, enFaseDesde) {
  if (enFaseDesde !== undefined) o.en_fase_desde = enFaseDesde;
  else if (s.estado !== o.estado || (s.fase || "") !== (o.fase || "")) o.en_fase_desde = new Date().toISOString();
  o.estado = s.estado; o.fase = s.fase; o.fecha_postulacion = s.fecha_postulacion;
}
async function cambiarSeguimiento(o, estado, fase, origen, aviso, { select, despues } = {}) {   // true si quedó guardado
  const r = await api("/api/marcar", pedidoMarcar(o, estado, fase, origen));
  if (!r.ok) {
    if (select) select.value = o.estado;
    mostrarAviso(mensajeError(r.status, r.json));
    return false;
  }
  const enFasePrevio = o.en_fase_desde;
  aplicarSeguimiento(o, r.json.actual);
  pintar();
  if (despues) despues();
  const cambio = r.json;
  mostrarAviso(aviso, async () => {
    const u = await api("/api/marcar", pedidoDeshacer(o, cambio));
    if (u.ok) {
      aplicarSeguimiento(o, u.json.actual, enFasePrevio); pintar(); if (despues) despues();
      mostrarAviso("Cambio deshecho (vuelve a «" + ETIQUETAS_ESTADO[u.json.actual.estado] + "»)");
    } else mostrarAviso("No se deshizo. " + mensajeError(u.status, u.json));
  });
  return true;
}
async function cambiarEstado(o, nuevo, origen, select) {
  if (o.estado === nuevo) return true;
  return cambiarSeguimiento(o, nuevo, undefined, origen, "Movida a «" + ETIQUETAS_ESTADO[nuevo] + "»", { select });
}
// tablero: arrastrar, "Mover a…" y "Descartar" pasan por las mismas reglas (movimientoTablero) y el mismo deshacer
async function moverEnTablero(o, destino, select) {
  if (select) select.value = "";
  const m = movimientoTablero(o, destino);
  if (!m) return;                                 // misma columna: ningún pedido
  if (m.bloqueado) { mostrarAviso(m.bloqueado); return; }
  const aviso = destino === "descartar" ? "Descartada: sale del tablero y queda en «Descartadas»" : "Movida a «" + nombreColumna(destino) + "»";
  if (!await cambiarSeguimiento(o, m.estado, m.fase, "tablero", aviso)) pintarLista();   // falló: la tarjeta queda en su columna
}

// ---------- detalle de una oferta: fases, estado, fecha, sueldo y prioridad manual, notas
let detalle = null;                               // {oferta, raiz, origen}
function cerrarDetalle() {
  if (!detalle) return;
  const origen = detalle.origen;
  detalle.raiz.remove();
  detalle = null;
  document.removeEventListener("keydown", tecladoDetalle, true);
  if (origen && document.contains(origen)) origen.focus();
}
function tecladoDetalle(e) {                      // Esc cierra; Tab no sale del diálogo
  if (!detalle) return;
  if (e.key === "Escape") { e.preventDefault(); cerrarDetalle(); return; }
  if (e.key !== "Tab") return;
  const foco = [...detalle.raiz.querySelectorAll("button, select, input, textarea, a[href]")].filter(x => !x.disabled && x.offsetParent !== null);
  if (!foco.length) return;
  const primero = foco[0], ultimo = foco[foco.length - 1];
  if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
  else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
  else if (!detalle.raiz.contains(document.activeElement)) { e.preventDefault(); primero.focus(); }
}
function abrirDetalle(o, origen) {
  if (detalle) cerrarDetalle();
  const url = urlSegura(o.url);
  const error = h("div", { class: "razon", role: "alert", hidden: true });
  const estadoSel = h("select", { id: "detalle-estado" }, ESTADOS.map(v => h("option", { value: v }, ETIQUETAS_ESTADO[v])));
  estadoSel.value = o.estado;
  const fecha = h("input", { type: "date", id: "detalle-fecha", max: hoy() });   // no futura (el servidor también lo exige)
  let fechaMostrada = "";                        // la que puso el programa; si el campo sigue igual, no lo tocaste tú
  const ponerFecha = v => { fecha.value = v || ""; fechaMostrada = fecha.value; };
  ponerFecha(o.fecha_postulacion);
  const sueldo = h("input", { type: "text", id: "detalle-sueldo", maxlength: "100", placeholder: o.sueldo && o.sueldo !== "No indicado" ? "Calculado: " + o.sueldo : "Ej: $1.200.000 líquido" });
  sueldo.value = o.sueldo_manual || "";
  const prioridad = h("select", { id: "detalle-prioridad" },
    h("option", { value: "" }, "Automática (" + (o.prioridad_calculada || "sin prioridad") + ")"),
    ["Alta", "Media", "Baja"].map(p => h("option", { value: p }, p + " (manual)")));
  prioridad.value = o.prioridad_manual || "";
  const notas = h("textarea", { id: "detalle-notas", maxlength: "5000", rows: "6", placeholder: "Contactos, fechas de entrevistas, impresiones…" });
  notas.value = o.notas || "";                    // value: el texto se muestra tal cual, nunca se interpreta como HTML
  const contador = h("div", { class: "sub", "aria-live": "polite" });
  const contar = () => { contador.textContent = notas.value.length + " / 5000"; };
  notas.addEventListener("input", contar); contar();

  const pasos = h("div", { class: "pipeline-pasos", role: "group", "aria-label": "Fase del proceso" });
  const pintarPasos = () => pasos.replaceChildren(...FASES_PIPELINE.map(f => h("button", {
      type: "button", class: "pipeline-paso" + (o.fase === f.id ? " activo" : ""), "aria-pressed": String(o.fase === f.id),
      onclick: async () => {
        const nueva = o.fase === f.id ? "" : f.id;              // pulsar la fase activa la quita
        const estado = nueva ? f.estado : o.estado;             // estado y fase en UN pedido (y un solo Deshacer)
        await cambiarSeguimiento(o, estado, nueva, "modal", nueva ? "Fase: " + f.nombre.replace(/^\d+\.\s*/, "") : "Fase quitada",
                                 { despues: refrescarProceso });
      } }, h("div", {}, f.nombre), h("div", { style: "font-size:.74rem; font-weight:normal; opacity:.85;" }, f.desc))));
  const refrescarProceso = () => {                          // tras guardar o deshacer: el diálogo muestra lo guardado
    if (!detalle || detalle.oferta !== o) return;
    estadoSel.value = o.estado;
    if (fecha.value === fechaMostrada) ponerFecha(o.fecha_postulacion);   // respeta una fecha que estés escribiendo
    pintarPasos();
  };
  pintarPasos();

  const grupo = (etq, campo) => h("div", { class: "form-grupo" }, h("label", { for: campo.id }, etq), campo);
  const form = h("form", { class: "modal-form", novalidate: true, onsubmit: async e => {
      e.preventDefault();
      error.hidden = true;

      if (fechaTocada && !fechaNoFutura(fecha.value, hoy())) {
        error.textContent = "La fecha de postulación no puede ser futura."; error.hidden = false; fecha.focus(); return;
      }
      if (estadoSel.value !== o.estado) {
        if (!await cambiarEstado(o, estadoSel.value, "modal")) return;
        if (!fechaTocada) ponerFecha(o.fecha_postulacion);   // respeta la fecha que acaba de poner el servidor
      }
      const cambios = cambiosSeguimiento(o, { notas: notas.value, fecha_postulacion: fecha.value, sueldo_manual: sueldo.value.trim(), prioridad_manual: prioridad.value });
      const r = Object.keys(cambios).length ? await api("/api/nota", { url: o.url, ...cambios }) : { ok: true, json: {} };
      if (!r.ok) { error.textContent = mensajeError(r.status, r.json); error.hidden = false; return; }
      if (r.json.oferta) Object.assign(o, r.json.oferta);
      cerrarDetalle(); pintar();
      if (Object.keys(cambios).length) mostrarAviso("Proceso y notas actualizados ✓");
    } },
    h("div", { class: "form-fila" }, grupo("Estado", estadoSel), grupo("Fecha de postulación", fecha)),
    h("div", { class: "form-fila" }, grupo("Sueldo (anotado por ti)", sueldo), grupo("Prioridad", prioridad)),
    h("div", { class: "form-grupo" }, h("label", { for: "detalle-notas" }, "Notas y bitácora"), notas, contador),
    error,
    h("div", { class: "modal-acciones" },
      h("button", { type: "button", class: "boton sec", style: "margin-right:auto; color:var(--rojo);",
        onclick: async () => { cerrarDetalle(); await cambiarEstado(o, "descartada", "modal"); } }, "❌ Descartar oferta"),
      h("button", { type: "button", class: "boton sec", onclick: cerrarDetalle }, "Cancelar"),
      h("button", { type: "submit", class: "boton" }, "Guardar cambios")));

  const meta = [o.empresa, o.ubicacion, o.modalidad, nombreFuente(o.fuente)].filter(Boolean).join(" · ");
  const sueldoTexto = o.sueldo && o.sueldo !== "No indicado" ? "💰 " + o.sueldo : "💰 Renta a convenir";
  const tarjeta = h("div", { class: "modal-tarjeta", role: "dialog", "aria-modal": "true", "aria-labelledby": "detalle-titulo" },
    h("div", { class: "modal-cabecera" },
      h("div", { style: "display:flex; align-items:center; gap:10px; min-width:0;" },
        h("div", { class: "avatar-empresa", "aria-hidden": "true" }, inicialDe(o)),
        h("div", { style: "min-width:0;" }, h("h2", { id: "detalle-titulo" }, o.titulo || "(sin título)"), h("div", { class: "sub" }, meta))),
      h("button", { type: "button", class: "btn-cerrar", "aria-label": "Cerrar", onclick: cerrarDetalle }, "✕")),
    h("div", { class: "chips" },

      url !== "#" ? h("a", { class: "chip", href: url, target: "_blank", rel: "noopener noreferrer" }, "↗ Ver aviso original") : null),
    h("div", { class: "pipeline-container" }, h("div", { class: "pipeline-titulo" }, "Fase del proceso"), pasos),
    form);
  montarDialogo(tarjeta, origen, estadoSel, o);
}
function montarDialogo(tarjeta, origen, foco, oferta) {   // overlay + Esc + foco atrapado, para cualquier diálogo
  if (detalle) cerrarDetalle();
  const raiz = h("div", { class: "modal-overlay", onclick: e => { if (e.target === raiz) cerrarDetalle(); } }, tarjeta);
  document.body.append(raiz);
  detalle = { oferta: oferta || null, raiz, origen };
  document.addEventListener("keydown", tecladoDetalle, true);
  foco.focus();
}

  estado.value = "postulada";
  const fecha = h("input", { type: "date", id: "manual-fecha", max: hoy(), title: "Si la dejas vacía y está postulada, se usa la de hoy" });
  const prioridad = h("select", { id: "manual-prioridad" }, h("option", { value: "" }, "Sin prioridad"), ["Alta", "Media", "Baja"].map(p => h("option", { value: p }, p)));
  const sueldo = h("input", { type: "text", id: "manual-sueldo", maxlength: "100", placeholder: "Ej: $1.200.000 líquido" });
  const fase = h("select", { id: "manual-fase" }, h("option", { value: "" }, "Sin fase"), FASES_PIPELINE.map(f => h("option", { value: f.id }, f.nombre)));
  const notas = h("textarea", { id: "manual-notas", maxlength: "5000", rows: "4", placeholder: "Contacto, cómo postulaste, próximos pasos…" });
  const grupo = (etq, campo) => h("div", { class: "form-grupo" }, h("label", { for: campo.id }, etq), campo);
  const form = h("form", { class: "modal-form", novalidate: true, onsubmit: async e => {
      e.preventDefault();
      error.hidden = true;
      if (!titulo.value.trim() || !empresa.value.trim()) { error.replaceChildren("El cargo y la empresa son obligatorios."); error.hidden = false; return; }
      const r = await api("/api/oferta/manual", { titulo: titulo.value, empresa: empresa.value, url: url.value.trim(), ubicacion: ubicacion.value,
        modalidad: modalidad.value, estado: estado.value, fecha_postulacion: fecha.value, prioridad_manual: prioridad.value,
        sueldo_manual: sueldo.value, fase: fase.value, notas: notas.value });
      if (r.status === 201) { cerrarDetalle(); await cargar(); mostrarAviso("Postulación agregada ✓"); return; }
      const existente = r.status === 409 && S.datos ? S.datos.principal.find(x => x.url === r.json.url_existente) : null;
      error.replaceChildren(mensajeManual(r.status, r.json),
        existente ? h("button", { type: "button", class: "boton sec", style: "margin-left:8px;", onclick: () => abrirDetalle(existente, $("btn-manual")) }, "Ver la existente") : null);
      error.hidden = false;
    } },
    h("div", { class: "form-fila" }, grupo("Cargo *", titulo), grupo("Empresa *", empresa)),
    h("div", { class: "form-fila" }, grupo("Enlace del aviso", url), grupo("Ubicación", ubicacion)),
    h("div", { class: "form-fila" }, grupo("Estado", estado), grupo("Fecha de postulación", fecha)),
    h("div", { class: "form-fila" }, grupo("Modalidad", modalidad), grupo("Prioridad", prioridad)),
    h("div", { class: "form-fila" }, grupo("Sueldo", sueldo), grupo("Fase", fase)),
    grupo("Notas", notas),
    error,
    h("div", { class: "modal-acciones" },
      h("button", { type: "button", class: "boton sec", onclick: cerrarDetalle }, "Cancelar"),
      h("button", { type: "submit", class: "boton" }, "Guardar postulación")));
  const tarjeta = h("div", { class: "modal-tarjeta", role: "dialog", "aria-modal": "true", "aria-labelledby": "manual-titulo-dialogo" },
    h("div", { class: "modal-cabecera" },
      h("h2", { id: "manual-titulo-dialogo" }, "Agregar postulación manual"),
      h("button", { type: "button", class: "btn-cerrar", "aria-label": "Cerrar", onclick: cerrarDetalle }, "✕")),
    h("p", { class: "sub", style: "margin:0 0 12px;" }, "Para una oferta que no trajo la búsqueda. Si ya la tienes (mismo cargo, empresa y ciudad, o el mismo enlace), te avisa en vez de duplicarla."),
    form);
  montarDialogo(tarjeta, origen, titulo);
}
$("btn-manual").addEventListener("click", e => abrirManual(e.currentTarget));

// ---------- exportar (descarga: el servidor responde con Content-Disposition: attachment)
function descargar(formato, alcance) {
  const enlace = h("a", { href: "/api/exportar?formato=" + formato + "&alcance=" + alcance, download: "" });
  document.body.append(enlace);
  enlace.click();
  enlace.remove();
}
$("btn-exportar-csv").addEventListener("click", () => descargar("csv", alcanceExportar(S.pestana)));
$("btn-exportar-json").addEventListener("click", () => descargar("json", "todas"));
$("btn-respaldo").addEventListener("click", async e => {
  const boton = e.currentTarget;
  boton.disabled = true;
  const r = await api("/api/respaldo", {});
  boton.disabled = false;
  if (r.status === 201) mostrarAviso("Respaldo guardado: " + r.json.respaldo.archivo + " (" + Math.round(r.json.respaldo.bytes / 1024) + " KB) ✓");
  else mostrarAviso(r.status === 429 ? "Ya hiciste un respaldo hace menos de un minuto." : (r.json && r.json.error) || mensajeError(r.status, r.json));
  await estado();
});
function selectorEstado(o, etiqueta) {
  const s = h("select", { class: "estado", "aria-label": etiqueta, onchange: e => cambiarEstado(o, e.target.value, "lista", e.target) },
    ESTADOS.map(v => h("option", { value: v }, ETIQUETAS_ESTADO[v])));
  s.value = o.estado;
  return s;
}

// ---------- tarjetas
const inicialDe = o => ((o.empresa || "?").trim().charAt(0) || "?").toUpperCase();
const clasePrio = o => "prio-" + (o.prioridad || "Media").toLowerCase();

function tarjeta(o, completa) {
  const url = urlSegura(o.url);
  const metaPartes = [o.empresa, o.ubicacion, o.modalidad, o.publicada ? "publicada " + fechaCL(o.publicada) : "", nombreFuente(o.fuente)].filter(Boolean);
  const meta = h("div", { class: "meta-limpia" }, ...metaPartes.flatMap((m, i) => i === 0 ? [h("span", {}, m)]
    : [h("span", { class: "meta-sep", "aria-hidden": "true" }, "·"), h("span", {}, m)]));

  const chips = [];
  if (completa) {
    if (o.estado === "nueva") chips.push(h("span", { class: "chip nueva" }, "nueva"));
    if (o.prioridad) { const p = etiquetaPrioridad(o); chips.push(h("span", { class: "chip " + o.prioridad, title: p.titulo }, p.texto)); }
    for (const v of [o.tipo, o.modalidad, o.contrato, o.sueldo && o.sueldo !== "No indicado" ? o.sueldo : "", o.experiencia && o.experiencia !== "No indicada" ? o.experiencia : ""]) {
      if (!v) continue;
      const esSueldo = v === o.sueldo && esSueldoDestacado(o.sueldo);
      chips.push(h("span", { class: "chip" + (/plazo/i.test(v) ? " aviso" : "") + (esSueldo ? " sueldo-destacado" : "") }, esSueldo ? "💵 " + v : v));
    }
    if (o.estado === "descartada" && o.fecha_postulacion) {
      chips.push(h("span", { class: "chip tenia-postulacion", title: "Esta oferta estuvo postulada antes de descartarla" }, "📌 Tenía postulación (" + fechaCL(o.fecha_postulacion) + ")"));
    }
    for (const sk of extraerSkills(o)) chips.push(h("span", { class: "skill-pill" }, sk));
  }
  const seg = completa ? avisoSeguimiento(o, hoy()) : null;

  return h("article", { class: "tarjeta " + clasePrio(o) + (CERRADOS.has(o.estado) ? " cerrada" : "") },
    h("div", { class: "tarjeta-header" },
      h("div", { class: "avatar-empresa", "aria-hidden": "true" }, inicialDe(o)),
      h("div", { class: "tarjeta-titulos" },
        h("div", { style: "display:flex; align-items:center; gap:8px;" },
          url !== "#" ? h("a", { class: "titulo", href: url, target: "_blank", rel: "noopener noreferrer" }, o.titulo || "(sin título)")
            : h("span", { class: "titulo" }, o.titulo || "(sin título)"),      // ingresada a mano sin URL
          url !== "#" ? h("a", { class: "btn-enlace-externo", href: url, target: "_blank", rel: "noopener noreferrer",
            title: "Abrir publicación original en " + nombreFuente(o.fuente), "aria-label": "Abrir publicación original" }, "↗") : null),
        meta)),
    chips.length ? h("div", { class: "chips" }, chips) : null,
    seg ? h("div", { style: "display:flex; gap:6px; align-items:center; margin-top:4px;" }, h("span", { class: "chip " + seg.clase, style: "font-size:.76rem;" }, seg.texto)) : null,
    completa && o.motivo ? h("div", { class: "motivo" }, o.motivo) : null,
    !completa && o.razon ? h("div", { class: "razon" }, "Motivo: " + o.razon) : null,
    h("div", { style: "display:flex; flex-direction:column; gap:6px; margin-top:6px;" },
      selectorEstado(o, "Estado de seguimiento de " + (o.titulo || "la oferta")),
      completa ? h("button", { type: "button", class: "btn-gestionar-oferta", "aria-haspopup": "dialog",
        onclick: e => abrirDetalle(o, e.currentTarget) }, "⚡ Gestionar proceso & Fases" + (o.notas ? " (con notas)" : "")) : null));
}

function filaCompacta(o) {
  const url = urlSegura(o.url);
  return h("div", { class: "fila-compacta " + clasePrio(o) },
    h("div", { class: "avatar-empresa", style: "width:28px; height:28px; font-size:.78rem;", "aria-hidden": "true" }, inicialDe(o)),
    h("div", { class: "cargo-box" },
      url !== "#" ? h("a", { class: "cargo-titulo", href: url, target: "_blank", rel: "noopener noreferrer" }, o.titulo || "(sin título)")
        : h("span", { class: "cargo-titulo" }, o.titulo || "(sin título)"),
      h("div", { class: "cargo-empresa" }, (o.empresa || "") + (o.ubicacion ? " · " + o.ubicacion : ""))),
    esSueldoDestacado(o.sueldo) ? h("span", { class: "chip sueldo-destacado ocultar-movil", style: "font-size:.74rem;" }, "💵 " + o.sueldo)
      : h("span", { class: "sub ocultar-movil", style: "font-size:.75rem;" }, "—"),
    h("span", { class: "chip " + (o.prioridad || "Media") + " ocultar-movil", style: "font-size:.75rem;", title: etiquetaPrioridad(o).titulo },
      o.prioridad ? etiquetaPrioridad(o).texto : "Media"),
    h("span", { class: "sub ocultar-movil", style: "font-size:.78rem;" }, o.modalidad || "—"),
    selectorEstado(o, "Estado de seguimiento de " + (o.titulo || "la oferta")),
    url !== "#" ? h("a", { class: "btn-enlace-externo", href: url, target: "_blank", rel: "noopener noreferrer", title: "Abrir aviso", "aria-label": "Abrir aviso" }, "↗")
      : h("span", { "aria-hidden": "true" }));
}

function kpisSeguimiento() {                     // cifras reales del embudo de Seguimiento: las mismas columnas del tablero
  const p = (S.datos && S.datos.principal) || [];
  const en = col => p.filter(o => columnaDe(o) === col).length;
  const tarjetaKpi = (etq, valor, estilo) => h("div", { class: "embudo-card", style: estilo || null },
    h("span", { class: "etiqueta" }, etq), h("span", { class: "valor", style: estilo ? estilo.replace("border-", "") : null }, valor));
  return h("div", { class: "embudo-grid" },
    tarjetaKpi("📌 Por Postular", en("P")),
    tarjetaKpi("✉️ CV Enviado", en("C")),
    tarjetaKpi("🎯 En Entrevista", en("E"), "border-color:var(--alta);"),
    tarjetaKpi("🏆 Oferta / Cierre", en("O"), "border-color:var(--nueva);"));
}

// ---------- tablero de Seguimiento (C2)
function selectorVista() {                       // "📊 Tablero / 📋 Lista", se recuerda en el navegador
  const boton = (valor, texto) => h("button", { type: "button", class: "btn-vista", "aria-pressed": String(S.vistaSeg === valor),
    "data-clave": "vista-" + valor, onclick: () => {
      S.vistaSeg = valor;
      try { localStorage.setItem("vistaSeguimiento", valor); } catch (e) {}
      conFoco($("lista"), pintarLista);
    } }, texto);
  return h("div", { class: "selector-vista", role: "group", "aria-label": "Vista de Seguimiento" },
    boton("tablero", "📊 Tablero"), boton("lista", "📋 Lista"));
}

let arrastrada = null;                            // la oferta en arrastre (el dataTransfer no se puede leer en dragover)
function tarjetaTablero(o) {
  const url = urlSegura(o.url), titulo = o.titulo || "(sin título)";
  const senales = senalesTablero(o, hoy());
  const mover = h("select", { class: "estado", "aria-label": "Mover a… (" + titulo + ")", onchange: e => moverEnTablero(o, e.target.value, e.target) },
    h("option", { value: "" }, "Mover a…"),
    opcionesMoverA(o).map(op => h("option", { value: op.valor, disabled: op.deshabilitada }, op.texto)));
  mover.value = "";
  const t = h("article", { class: "tarjeta " + clasePrio(o),
    // se arrastra solo desde la tarjeta misma: sobre el selector, un botón o un enlace no es arrastrable, así esos
    // controles funcionan normal (en Firefox un <select> dentro de un elemento draggable no se deja abrir)
    onmousedown: e => { t.draggable = !e.target.closest("select, option, button, a, input, textarea"); },
    ondragstart: e => {
      if (e.target !== t) return;
      arrastrada = o;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", titulo);  // Firefox no inicia el arrastre sin datos
      t.classList.add("arrastrando");
    },
    ondragend: () => {
      arrastrada = null; t.draggable = false; t.classList.remove("arrastrando");
      for (const c of document.querySelectorAll(".zona-drop-activa")) c.classList.remove("zona-drop-activa");
    } },
    h("div", { class: "tarjeta-header" },
      h("div", { class: "avatar-empresa", "aria-hidden": "true" }, inicialDe(o)),
      h("div", { class: "tarjeta-titulos" },
        url !== "#" ? h("a", { class: "titulo", href: url, target: "_blank", rel: "noopener noreferrer" }, titulo) : h("span", { class: "titulo" }, titulo),
        h("div", { class: "meta-limpia" }, [o.empresa, o.ubicacion, o.modalidad].filter(Boolean).join(" · ")))),
    h("div", { class: "chips" },
      o.prioridad ? h("span", { class: "chip " + o.prioridad, title: etiquetaPrioridad(o).titulo }, etiquetaPrioridad(o).texto) : null,
      o.fase ? h("span", { class: "chip" }, "Fase: " + nombreFase(o.fase)) : null,
      senales.etapa ? h("span", { class: "chip" }, senales.etapa.texto) : null),
    senales.seguimiento ? h("div", { class: "senal-seguimiento" },            // en línea propia
      h("span", { class: "chip " + senales.seguimiento.clase }, senales.seguimiento.texto)) : null,
    h("div", { class: "acciones-tablero" },
      mover,
      h("button", { type: "button", class: "btn-gestionar-oferta", "aria-haspopup": "dialog", onclick: e => abrirDetalle(o, e.currentTarget) },
        "⚡ Gestionar proceso" + (o.notas ? " (con notas)" : "")),
      h("button", { type: "button", class: "boton sec btn-descartar", title: "Cambia solo el estado; se puede deshacer",
        onclick: () => moverEnTablero(o, "descartar") }, "❌ Descartar")));
  return t;
}
function columnaTablero(c, items) {
  const col = h("section", { class: "kanban-col", "aria-label": c.nombre + ": " + TXT.ofertas(items.length),
    ondragover: e => { if (!arrastrada) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("zona-drop-activa"); },
    ondragleave: e => { if (!col.contains(e.relatedTarget)) col.classList.remove("zona-drop-activa"); },
    ondrop: e => {
      e.preventDefault(); col.classList.remove("zona-drop-activa");
      const o = arrastrada; arrastrada = null;
      if (o) moverEnTablero(o, c.id);
    } },
    h("div", { class: "kanban-col-header" }, h("h3", {}, c.nombre), h("span", { class: "cuenta" }, items.length)),
    h("div", { class: "kanban-col-items" }, items.length ? items.map(tarjetaTablero) : h("div", { class: "kanban-vacio" }, "Sin ofertas aquí")));
  return col;
}
function tableroSeguimiento(filas) {
  const por = Object.fromEntries(COLUMNAS_TABLERO.map(c => [c.id, []]));
  for (const o of filas) { const c = columnaDe(o); if (c) por[c].push(o); }
  return h("div", { class: "kanban-board" }, COLUMNAS_TABLERO.map(c => columnaTablero(c, por[c.id])));
}

function pintarLista() {
  const cont = $("lista");
  if (!S.datos) { cont.replaceChildren(h("div", { class: "vacio" }, "Cargando…")); return; }
  const filas = listaDe(S.datos, S.pestana, S.sel).filter(pasa);
  const completa = PESTANAS_PRINCIPAL.has(S.pestana);
  const pintarItems = lista => S.densidad === "compacta"
    ? [h("div", { class: "tabla-compacta" }, ...lista.map(filaCompacta))] : lista.map(o => tarjeta(o, completa));
  const cabecera = S.pestana === "seguimiento" ? [selectorVista(), kpisSeguimiento()] : [];
  if (S.pestana === "seguimiento" && S.vistaSeg === "tablero") { cont.replaceChildren(...cabecera, tableroSeguimiento(filas)); return; }
  if (!filas.length) {
    const msj = S.sel.tipo !== "todas" && !SIN_FILTRO_HISTORIAL.has(S.pestana) ? "No hay ofertas de esta selección en esta pestaña."
      : S.pestana === "ofertas" ? "No hay ofertas con estos filtros. Prueba «Buscar empleos» o relaja los filtros."
      : S.pestana === "descartadas_usuario" ? "No tienes ofertas descartadas manualmente."
      : "Nada que mostrar aquí.";
    cont.replaceChildren(...cabecera, h("div", { class: "vacio" }, msj)); return;
  }
  if (S.pestana === "ofertas") {
    const porFuente = S.agrupar === "fuente", grupos = new Map();
    for (const o of filas) {
      const clave = porFuente ? nombreFuente(o.fuente) : (o.prioridad || "sin prioridad");
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(o);
    }
    const orden = ["Alta", "Media", "Baja"];
    const claves = [...grupos.keys()].sort(porFuente
      ? (a, b) => grupos.get(b).length - grupos.get(a).length || a.localeCompare(b)
      : (a, b) => (orden.indexOf(a) + 1 || 9) - (orden.indexOf(b) + 1 || 9));
    cont.replaceChildren(...claves.flatMap(k => [
      h("h3", { class: "grupo" }, porFuente ? k : "Prioridad " + k, h("span", { class: "cuenta" }, grupos.get(k).length)),
      ...pintarItems(grupos.get(k))]));
    return;
  }
  let nota = null;
  if (S.pestana === "descartadas" && S.datos.total_descartadas > S.datos.descartadas.length)
    nota = h("p", { class: "sub" }, S.sel.tipo === "todas"
      ? "Mostrando " + TXT.masRecientes(S.datos.descartadas.length) + " de " + S.datos.total_descartadas + "."
      : "Se busca solo entre " + TXT.descartadasMasRecientes(S.datos.descartadas.length) + " (de " + S.datos.total_descartadas + ").");
  cont.replaceChildren(...cabecera, ...[nota].filter(Boolean), ...pintarItems(filas));
}

function pintar() { pintarHistorial(); pintarEncabezado(); pintarPestanas(); pintarFiltros(); pintarLista(); }

// atajo global: "/" o Ctrl+K llevan al buscador
window.addEventListener("keydown", e => {
  if (detalle) return;                            // con el detalle abierto, el teclado es del diálogo
  const activo = document.activeElement;
  const escribiendo = activo && ["INPUT", "TEXTAREA", "SELECT"].includes(activo.tagName);
  if ((e.key === "/" && !escribiendo) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault();
    const buscador = document.querySelector(".filtros input[type=search]");
    if (buscador) { buscador.focus(); buscador.select(); }
  }
});

cargar();
</script>
</body>
